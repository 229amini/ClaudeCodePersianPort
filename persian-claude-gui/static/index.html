<!doctype html>
<html dir="rtl" lang="fa">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>کلود</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<!-- The shell is dir="rtl" (Persian UI decision, plan §B-2). The spec's
     "never global dir=rtl" rule therefore survives only by discipline: every
     content-bearing element below carries its own direction, set in app.js. -->

<header id="topbar">
  <button type="button" id="btn-sessions" class="ghost"></button>
  <button type="button" id="btn-folder" class="ghost"></button>
  <a id="btn-help" class="ghost" href="/static/help.html" target="_blank" rel="noopener"></a>
  <span id="topbar-cwd" class="path"></span>
</header>

<main id="log" aria-live="polite" aria-label="گفتگو"></main>

<div id="replay-banner" hidden></div>

<form id="composer">
  <div id="attachments" hidden></div>

  <!-- Slash-command autocomplete. Populated from system/init's slash_commands
       list, which is authoritative for the target machine's real setup. -->
  <ul id="slash-popup" hidden role="listbox" aria-label="دستورها"></ul>

  <div class="composer-row">
    <button type="button" id="btn-attach" class="ghost icon" aria-label="پیوست فایل">
      <!-- SVG, not an emoji: emoji render differently per platform and cannot
           be themed. -->
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none"
           stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
           stroke-linejoin="round" aria-hidden="true">
        <path d="M21.44 11.05l-8.49 8.49a5.5 5.5 0 01-7.78-7.78l8.49-8.49a3.67 3.67 0 015.19 5.19l-8.5 8.49a1.83 1.83 0 01-2.59-2.59l7.84-7.83"/>
      </svg>
    </button>
    <label class="sr-only" for="input">پیام</label>
    <textarea id="input" rows="1" dir="auto" placeholder="پیام خود را بنویسید…"
              autocomplete="off" spellcheck="false"></textarea>
    <button type="submit" id="send">ارسال</button>
    <button type="button" id="stop" class="danger" hidden></button>
  </div>
  <div id="composer-hint" class="meta"></div>
</form>

<footer id="statusline" aria-label="نوار وضعیت"></footer>

<dialog id="sessions">
  <header class="dlg-head">
    <h2 id="sessions-title"></h2>
    <button type="button" id="sessions-close" class="ghost"></button>
  </header>
  <section id="recents-section">
    <h3 id="recents-title"></h3>
    <ul id="recents-list"></ul>
  </section>
  <h3 id="sessions-subtitle"></h3>
  <ul id="sessions-list"></ul>
</dialog>

<!-- Native <dialog>: modal semantics, focus trap, Escape and a backdrop for
     free. Escape resolves as DENY (see app.js) — dismissing must never be
     mistaken for approval. -->
<dialog id="perm">
  <form method="dialog" id="perm-form">
    <h2 id="perm-title"></h2>
    <p id="perm-body" dir="auto"></p>
    <div id="perm-tool"></div>
    <pre id="perm-params"></pre>
    <label id="perm-remember-row">
      <input type="checkbox" id="perm-remember">
      <span id="perm-remember-label"></span>
    </label>
    <menu>
      <button value="deny" class="ghost" id="perm-deny"></button>
      <button value="allow" id="perm-allow"></button>
    </menu>
  </form>
</dialog>

<script src="/static/strings.fa.js"></script>
<script src="/static/vendor/marked.min.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
