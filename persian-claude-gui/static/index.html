<!doctype html>
<html dir="rtl" lang="fa">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>کلود</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body class="app">

<!-- The shell is dir="rtl" (Persian UI decision, plan §B-2). The spec's
     "never global dir=rtl" rule therefore survives only by discipline: every
     content-bearing element below carries its own direction, set in js/bidi.js.
     Being RTL, the first grid column — the sidebar — lands on the RIGHT. -->

<aside id="sidebar">
  <div class="side-head">
    <svg class="spark" viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true">
      <path d="M12 2l1.8 6.4L20 6.6l-4.4 4.9 5.9 3-6.6.6 1.5 6.5L12 16.4 7.6 21.6l1.5-6.5-6.6-.6 5.9-3L4 6.6l6.2 1.8z"/>
    </svg>
    <span class="brand">کلود</span>
  </div>

  <button type="button" id="btn-new" class="new-chat">
    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor"
         stroke-width="2" stroke-linecap="round" aria-hidden="true">
      <path d="M12 5v14M5 12h14"/>
    </svg>
    <span id="btn-new-label"></span>
  </button>

  <div class="side-scroll">
    <h2 id="projects-title" class="side-title"></h2>
    <nav id="projects" aria-label="پروژه‌ها"></nav>
  </div>

  <div class="side-foot">
    <a id="btn-help" class="side-item" href="/static/help.html" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor"
           stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
        <circle cx="12" cy="12" r="9.2"/>
        <path d="M9.4 9.2a2.6 2.6 0 115.1.9c-.5 1.5-2 1.7-2 3.2"/>
        <circle cx="12.4" cy="16.8" r=".4" fill="currentColor"/>
      </svg>
      <span id="btn-help-label"></span>
    </a>
  </div>
</aside>

<div id="stage">
  <header id="topbar">
    <bdi id="topbar-name"></bdi>
    <span id="topbar-cwd" class="path"></span>
  </header>

  <main id="log" aria-live="polite" aria-label="گفتگو"></main>

  <!-- Home / empty state: big greeting above the composer, claude.ai-style.
       Visibility is driven by whether #log has children (js/chrome.js). -->
  <section id="home" hidden>
    <h1 class="greeting">
      <svg class="spark" viewBox="0 0 24 24" width="30" height="30" fill="currentColor" aria-hidden="true">
        <path d="M12 2l1.8 6.4L20 6.6l-4.4 4.9 5.9 3-6.6.6 1.5 6.5L12 16.4 7.6 21.6l1.5-6.5-6.6-.6 5.9-3L4 6.6l6.2 1.8z"/>
      </svg>
      <span id="greeting-text"></span>
    </h1>
  </section>

  <div id="replay-banner" hidden></div>

  <form id="composer">
    <div class="comp-box">
      <!-- Slash-command autocomplete. Populated from system/init's
           slash_commands list, authoritative for this machine. -->
      <ul id="slash-popup" hidden role="listbox" aria-label="دستورها"></ul>

      <!-- One popup serves both the model picker and the approval pill: they
           are never open at the same time, and it keeps a single
           click-outside/Escape handler (js/controls.js). -->
      <div id="menu-popup" hidden role="menu"></div>

      <div id="attachments" hidden></div>

      <label class="sr-only" for="input">پیام</label>
      <textarea id="input" rows="1" dir="auto" placeholder="پیام خود را بنویسید…"
                autocomplete="off" spellcheck="false"></textarea>

      <div class="comp-row">
        <button type="button" id="btn-attach" class="ghost icon" aria-label="پیوست فایل">
          <!-- SVG, not an emoji: emoji render differently per platform and
               cannot be themed. -->
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none"
               stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
               stroke-linejoin="round" aria-hidden="true">
            <path d="M21.44 11.05l-8.49 8.49a5.5 5.5 0 01-7.78-7.78l8.49-8.49a3.67 3.67 0 015.19 5.19l-8.5 8.49a1.83 1.83 0 01-2.59-2.59l7.84-7.83"/>
          </svg>
        </button>

        <button type="button" id="proj-chip" class="chip-btn" title="">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor"
               stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M3 7a2 2 0 012-2h4l2 2h8a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2z"/>
          </svg>
          <bdi id="proj-chip-name" class="path"></bdi>
        </button>

        <!-- Model picker and approval pill are rendered entirely from what
             `initialize` returned (js/controls.js). Hidden until it arrives —
             a hardcoded model list would be wrong on any other plan. -->
        <button type="button" id="model-chip" class="chip-btn" hidden>
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor"
               stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 3l2.2 5.1 5.3.6-4 3.6 1.2 5.2L12 14.9 7.3 17.5l1.2-5.2-4-3.6 5.3-.6z"/>
          </svg>
          <span id="model-chip-name" dir="auto"></span>
        </button>

        <button type="button" id="posture-chip" class="chip-btn" hidden>
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor"
               stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 3l7 3v5.5c0 4.2-2.9 7.6-7 9-4.1-1.4-7-4.8-7-9V6z"/>
          </svg>
          <span id="posture-chip-name" dir="auto"></span>
        </button>

        <!-- Audit counter for the "خودکار" posture: approvals the wrapper gave
             on the user's behalf. Never hidden behind a menu. -->
        <span id="auto-chip" class="chip-btn is-info" hidden></span>

        <span class="comp-spacer"></span>

        <button type="submit" id="send" class="round" aria-label="ارسال">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor"
               stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 19V5M5.5 11.5L12 5l6.5 6.5"/>
          </svg>
        </button>
        <button type="button" id="stop" class="round danger" hidden aria-label="توقف">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor" aria-hidden="true">
            <rect x="6" y="6" width="12" height="12" rx="2"/>
          </svg>
        </button>
      </div>
    </div>
    <div id="composer-hint" class="meta"></div>
  </form>

  <footer id="statusline" aria-label="نوار وضعیت"></footer>
</div>

<!-- Native <dialog>: modal semantics, focus trap, Escape and a backdrop for
     free. Escape resolves as DENY (see js/chrome.js) — dismissing must never be
     mistaken for approval. -->
<dialog id="perm">
  <form method="dialog" id="perm-form">
    <h2 id="perm-title"></h2>
    <p id="perm-body" dir="auto"></p>
    <div id="perm-tool"></div>
    <pre id="perm-params"></pre>
    <label id="perm-remember-row">
      <input type="checkbox" id="perm-remember">
      <span id="perm-remember-label"></span>
    </label>
    <menu>
      <button value="deny" class="ghost" id="perm-deny"></button>
      <button value="allow" id="perm-allow"></button>
    </menu>
  </form>
</dialog>

<!-- Classic scripts on purpose: they set window globals (FA, marked) and every
     classic script finishes before the first module runs. -->
<script src="/static/strings.fa.js"></script>
<script src="/static/vendor/marked.min.js"></script>
<script type="module" src="/static/js/app.js"></script>
</body>
</html>
