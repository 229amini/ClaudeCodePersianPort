<!doctype html>
<html dir="rtl" lang="fa">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>spec tests 1–12</title>
<link rel="stylesheet" href="/static/style.css">
<style>
  /* Harness chrome only — never let this file introduce direction rules. */
  body { grid-template-rows: 1fr auto auto; }
  .case-head {
    align-self: stretch; max-width: none;
    margin-block-start: 1.2em; padding: 6px 10px;
    border-inline-start: 3px solid var(--accent);
    background: var(--surface-2); border-radius: 6px;
  }
  .case-head b { font-weight: 700; }
  .case-head .expect { display: block; color: var(--fg-muted); font-size: .85em; }
  #verdict { padding: 10px var(--gap); background: var(--surface); border-block-start: 1px solid var(--border); }
  #verdict .fail { color: var(--danger); font-weight: 700; }
  #verdict .pass { color: var(--ok); font-weight: 700; }
</style>
</head>
<!-- data-render-only: this page carries a token so its subresources authenticate,
     but it must not open the SSE stream — live events would land in the middle
     of the test log. js/app.js reads the attribute. -->
<body data-render-only>

<main id="log" aria-label="spec tests"></main>

<!-- Test 6 needs the real composer handler, so the harness carries the real
     composer markup and lets js/composer.js bind to it. -->
<form id="composer">
  <label class="sr-only" for="input">ZWNJ test</label>
  <textarea id="input" rows="1" dir="auto"
            placeholder="تست ۶: «می» سپس Shift+Space سپس «رود»"></textarea>
  <button type="submit" id="send">ارسال</button>
  <!-- The Esc case routes through the stop button's own click handler, so the
       harness needs the button itself; setBusy() also unhides it. -->
  <button type="button" id="stop" hidden aria-label="توقف (Esc)">توقف</button>
</form>

<footer id="statusline"></footer>

<!-- js/composer.js reads this at module-evaluation time; without it the context
     notice silently no-ops, which is also what a broken one looks like. -->
<div id="context-notice" hidden></div>

<!-- Window chrome the concurrent-conversation cases assert against: a
     background tab's event must leave every one of these alone. js/chrome.js
     and js/controls.js grab the ids at module-evaluation time; the model chip
     ships `hidden`, exactly as in index.html. The rest of the composer row is
     deliberately absent — initControls() binds nothing without #menu-popup. -->
<div id="harness-chrome">
  <bdi id="topbar-name"></bdi>
  <button type="button" id="model-chip" hidden>
    <span id="model-chip-name" dir="auto"></span>
  </button>
  <!-- The open-conversations group. The rest of the sidebar is deliberately
       absent (#projects stays out, so no fetch is ever fired), but this list is
       drawn from live data and carries a Windows path per row — the exact site
       plan §B-10 item 2 says the message-shaped cases cannot cover. -->
  <h2 id="tabs-title" hidden></h2>
  <nav id="open-tabs" hidden></nav>
</div>

<!-- Case 10 drives the REAL permission dialog through window.renderEvent, so the
     harness needs its markup verbatim from index.html. js/chrome.js reads these
     ids at module-evaluation time; without them showPermission() throws and the
     verdict comes back empty. -->
<dialog id="perm">
  <form method="dialog" id="perm-form">
    <h2 id="perm-title"></h2>
    <p id="perm-body" dir="auto"></p>
    <p id="perm-source" class="meta" dir="auto" hidden></p>
    <div id="perm-tool"></div>
    <pre id="perm-params"></pre>
    <div id="perm-ask"></div>
    <label id="perm-remember-row">
      <input type="checkbox" id="perm-remember">
      <span id="perm-remember-label"></span>
    </label>
    <menu>
      <button value="deny" class="ghost" id="perm-deny"></button>
      <button value="allow" id="perm-allow"></button>
    </menu>
  </form>
</dialog>

<div id="verdict"></div>

<!-- strings.fa.js and marked stay CLASSIC scripts (they set window globals and
     finish before any module runs); the app is a module tree. The harness block
     below MUST be type="module" too: module scripts are deferred and execute in
     document order, so this is what guarantees window.renderEvent exists by the
     time the cases run. As a classic script it would run FIRST and every
     assertion would fail in a way that looks exactly like a BiDi regression. -->
<script src="/static/strings.fa.js"></script>
<script src="/static/vendor/marked.min.js"></script>
<script type="module" src="/static/js/app.js"></script>
<script type="module">
/* The agents drawer's render seam has no window alias (nothing else needs one),
   so the harness imports it. Module scripts execute in document order, so
   js/app.js has already evaluated this module — the import reuses it. */
import { withRenderTarget, newRenderScope, state } from "/static/js/render.js";
/* The tab registry and the synchronous half of a switch. Importing the ENTRY
   module is safe from here and only from here: nothing in the module tree may
   import app.js (its body runs last — see the load-order note there), but this
   block runs after every module has evaluated. */
import {
  routeEvent, applySwitch, tabs, renderInTab, applyTabs,
} from "/static/js/app.js";
/* The sidebar's open-conversations group: app.js hands chrome.js the list and
   the two verbs, so the harness can stand in for app.js and drive the group
   exactly as the real window does. */
import { setOpenTabs, setTabBridge } from "/static/js/chrome.js";
/* The posture cycle's "nothing confirmed yet" branch: this is the only way to
   put controls.js back to a conversation that has not answered. */
import { restoreControls } from "/static/js/controls.js";
/* The «away» clock the session recap is gated on — a real five minutes, and the
   only way to test it without waiting them out. */
import { isAway } from "/static/js/composer.js";

/* Each case is pushed through the SHIPPING renderer (window.renderEvent), not a
   copy, so a regression in the renderer fails here. Cases match
   claude-persian-rtl-spec.md §"Test cases" exactly. */
const CASES = [
  [1, "سلام دنیا",
      "راست‌چین، راست به چپ، حروف چسبیده"],
  [2, "Hello world",
      "چپ‌چین، بدون تغییر"],
  [3, "فایل C:\\Users\\Lion\\Desktop\\test.md را باز کن",
      "متن فارسی راست‌چین؛ مسیر سالم و خوانا از چپ به راست، بک‌اسلش‌ها سر جای خود"],
  [4, "```js\nif (x > 0) { return \"ok\"; }\n```",
      "چپ‌چین، LTR، آکولاد و نقل‌قول سر جای خود"],
  [5, "نسخه 2.1.221 نصب شد",
      "شماره نسخه 2.1.221 خوانده شود، جابه‌جا نشود"],
  [6, null,
      "در کادر پایین بنویسید «می» + Shift+Space + «رود» → باید می‌رود شود، نه میرود"],
  [7, "این یک بند فارسی است که بلافاصله بعد از آن یک بلوک کد می‌آید.\n\n```py\ndef ok(): return 1\n```",
      "هیچ‌کدام جهت یا چینش دیگری را خراب نکند"],
  [8, "این یک بند طولانی فارسی است که باید روی چند خط بشکند و در هر خط راست‌چین بماند بدون آنکه دنباله حروف بریده شود. " +
      "متن باید با فاصله سطر مناسب نمایش داده شود تا حروف کشیده و زیرنویس‌دار روی هم نیفتند و خواندن آن راحت باشد. " +
      "این بند به‌عمد بلند نوشته شده تا شکست خط چندباره اتفاق بیفتد.",
      "چینش راست در همه خطوط، بدون بریدگی زیرنویس"],
];

// Kept from the classic-script era, when app.js and this block shared one
// global scope and both declaring `log` threw. Module scope makes that
// impossible now, but the assertions below are the contract — leave them alone.
const specLog = document.getElementById("log");

function caseHead(n, expected) {
  const head = document.createElement("div");
  head.className = "case-head";
  head.setAttribute("dir", "auto");
  head.innerHTML = "<b>تست " + n + "</b>";
  const exp = document.createElement("span");
  exp.className = "expect";
  exp.setAttribute("dir", "auto");
  exp.textContent = expected;
  head.append(exp);
  specLog.append(head);
}

for (const [n, markdown, expected] of CASES) {
  caseHead(n, expected);
  if (markdown === null) continue;   // case 6 is interactive
  window.renderEvent({
    type: "assistant",
    message: { content: [{ type: "text", text: markdown }] },
  });
}

/* Cases 9–12: BiDi at the moment of consent (spec rule 8). These are not
   messages — they are tool parameters and tool output, the one place the
   message-shaped cases above structurally cannot reach. */
const PERSIAN_LINE = "این خط فارسی است";
const WRITE_CONTENT = PERSIAN_LINE + "\nconst x = 1;\n\n" + "مقدار 42 تنظیم شد";

caseHead(9, "کارت ابزار: خطوط فارسیِ محتوای Write راست‌چین، کد لاتین چپ‌چین");
window.renderEvent({
  type: "assistant",
  message: { content: [{
    type: "tool_use", id: "spec9", name: "Write",
    input: { file_path: "C:\\Users\\Lion\\Desktop\\note.md", content: WRITE_CONTENT },
  }] },
});

caseHead(10, "پنجره تأیید: new_string فارسیِ Edit خواناست، نه چپ‌چین");
window.renderEvent({
  type: "wrapper", subtype: "permission_request", request_id: "spec10",
  tool_name: "Edit", tool_use_id: "spec10-tool",
  tool_input: {
    file_path: "C:\\Users\\Lion\\Desktop\\note.md",
    old_string: "old",
    new_string: PERSIAN_LINE + "\nreturn true;",
  },
});

caseHead(11, "خروجی ابزار با خطوط فارسی و لاتین: هر خط جهت خودش");
caseHead(12, "رقم لاتین کنار متن فارسی در همان خط می‌ماند");
window.renderEvent({
  type: "assistant",
  message: { content: [{
    type: "tool_use", id: "spec11", name: "Bash", input: { command: "type note.md" },
  }] },
});
window.renderEvent({
  type: "user",
  message: { content: [{
    type: "tool_result", tool_use_id: "spec11",
    content: PERSIAN_LINE + "\nSecond line in English\n" + "مقدار 42 تنظیم شد",
  }] },
});

/* Automated checks for the failures that are invisible to a screenshot. */
const checks = [];
function check(name, ok, detail) { checks.push({ name, ok, detail }); }

const bubbles = [...specLog.querySelectorAll(".msg.assistant")];

check("base CSS: .msg is unicode-bidi:plaintext",
  getComputedStyle(bubbles[0]).unicodeBidi === "plaintext",
  getComputedStyle(bubbles[0]).unicodeBidi);

const anyPre = specLog.querySelector("pre");
check("base CSS: pre is direction:ltr + isolate",
  getComputedStyle(anyPre).direction === "ltr" &&
  getComputedStyle(anyPre).unicodeBidi === "isolate",
  getComputedStyle(anyPre).direction + " / " + getComputedStyle(anyPre).unicodeBidi);

// Outside a list, because a list is one block and its items deliberately give
// up their own dir so the list can read them — see the list checks below.
// "auto" or "rtl": a block that measures at least half Persian is pinned rtl
// (bidi.js autoDir) because dir="auto" is first-strong and this content opens
// with a Latin technical term all the time. Everything else keeps "auto", so
// the browser still decides the LTR side. What rule 1 forbids is a block with
// NO direction of its own.
check("rule 1: every block element carries its own direction",
  [...specLog.querySelectorAll(".msg p")]
    .filter(p => !p.closest("li"))
    .every(p => ["auto", "rtl"].includes(p.getAttribute("dir"))),
  [...new Set([...specLog.querySelectorAll(".msg p")]
    .map(p => p.getAttribute("dir")))].join(","));

const case3 = bubbles[2];
const bdi = case3.querySelector("bdi.path");
check("rule 2: bare Windows path wrapped in <bdi>",
  !!bdi && bdi.textContent === "C:\\Users\\Lion\\Desktop\\test.md",
  bdi ? bdi.textContent : "no <bdi> found");

const case5 = bubbles[4];
const ver = case5.querySelector("bdi.path");
check("rule 2: version number isolated",
  !!ver && ver.textContent === "2.1.221", ver ? ver.textContent : "none");

check("rule 3: Vazirmatn is the body face",
  getComputedStyle(document.body).fontFamily.includes("Vazirmatn"));

check("rule 4: line-height >= 1.9 on Persian text",
  parseFloat(getComputedStyle(bubbles[0]).lineHeight) /
  parseFloat(getComputedStyle(bubbles[0]).fontSize) >= 1.89,
  getComputedStyle(bubbles[0]).lineHeight);

check("rule 5: digits inside <pre> stay Latin",
  !/[۰-۹]/.test(specLog.querySelector("pre").textContent));

check("no global dir=rtl leak: code block computes LTR inside RTL shell",
  getComputedStyle(specLog.querySelector("pre code")).direction === "ltr");

check("a code block is wrapped in .code-wrap",
  specLog.querySelector("pre").parentElement?.className === "code-wrap",
  specLog.querySelector("pre").parentElement?.className ?? "no wrapper");

check("the code block carries a copy button",
  !!specLog.querySelector(".code-wrap .code-copy"));

check("the copy button lives outside <pre>, never joins its textContent",
  !specLog.querySelector("pre").textContent.includes("کپی"),
  specLog.querySelector("pre").textContent);

check("page does not scroll horizontally",
  document.documentElement.scrollWidth <= document.documentElement.clientWidth,
  document.documentElement.scrollWidth + " vs " + document.documentElement.clientWidth);

const input = document.getElementById("input");
input.value = "می" + "\u200C" + "رود";
check("rule 6: ZWNJ survives in the composer value",
  input.value.includes("\u200C"));

/* --- rule 8: LTR containers, per-line direction ---------------------------- */
const dirOf = (el) => el && getComputedStyle(el).direction;

/* A Write's content is rendered as a DIFF now, not as a parameter blob — so
   rule 8's contract ("LTR container, direction decided per line") has to hold
   in `.diff` instead of in `.tool-output`. Same rule, different element; these
   checks moved with it rather than being dropped, because the content under
   test is exactly the same Persian/Latin/blank mixture. */
const card9 = [...specLog.querySelectorAll("details.card.tool:not(.group)")]
  .find(c => c.querySelector(".diff"));
const box9 = card9?.querySelector(".diff");
const lines9 = box9 ? [...box9.querySelectorAll(".dt")] : [];

check("rule 8: tool-card diff box stays LTR",
  dirOf(box9) === "ltr", dirOf(box9) ?? "no diff box");

check("rule 8: Persian line inside the LTR box resolves RTL",
  lines9[0]?.getAttribute("dir") === "auto" && dirOf(lines9[0]) === "rtl",
  (lines9[0]?.textContent ?? "?") + " -> " + (dirOf(lines9[0]) ?? "none"));

check("rule 8: Latin line in the same box stays LTR",
  dirOf(lines9[1]) === "ltr", lines9[1]?.textContent ?? "none");

/* Direction alone was not enough: the container's `text-align: left` inherits
   into the lines, so an RTL line stayed pinned to the left edge. Anything but
   a left-forcing value means each line aligns to its own start. */
check("rule 8: the RTL line aligns to its own start, not the box's left",
  ["start", "right", "end"].includes(getComputedStyle(lines9[0] ?? document.body).textAlign),
  getComputedStyle(lines9[0] ?? document.body).textAlign);

check("rule 8: every line of the content survives, blank one included",
  lines9.length === 4 && lines9[2]?.textContent === "",
  lines9.length + " lines");

/* The diff itself: a Write is all additions, and the count on the collapsed row
   is what tells the user how big the change is before they open it. */
check("a Write renders as an all-additions diff",
  box9?.querySelectorAll(".dl.add").length === 4 &&
  box9?.querySelectorAll(".dl.del").length === 0,
  (box9?.querySelectorAll(".dl.add").length ?? 0) + " added, " +
  (box9?.querySelectorAll(".dl.del").length ?? 0) + " removed");
/* textContent is LOGICAL order and says "+4" no matter how it renders, so it
   cannot see this: + and − are BiDi-neutral, and in the RTL summary row they
   reorder to the far side of their digits — "+2 −1" reads "1- 2+" on screen.
   Only the computed direction catches it. Rule 2, smallest possible token. */
const stat9 = card9?.querySelector(".diff-stat");
check("the collapsed row's +/- count is LTR-isolated, not just Latin",
  stat9?.querySelector(".d-add")?.textContent === "+4" &&
  dirOf(stat9) === "ltr" && getComputedStyle(stat9).unicodeBidi === "isolate",
  (stat9?.textContent ?? "no count") + " -> " + (dirOf(stat9) ?? "none") +
  " / " + (stat9 ? getComputedStyle(stat9).unicodeBidi : "none"));

/* Not a BiDi rule, but the same class of silent failure: #log is a column flex
   box, and details.card sets overflow:hidden, which zeroes a flex item's
   automatic minimum size. Without flex:none every tool card was crushed to its
   border the moment the transcript got long enough to scroll. */
check("tool cards cannot be flex-shrunk out of existence",
  getComputedStyle(card9 ?? document.body).flexShrink === "0",
  getComputedStyle(card9 ?? document.body).flexShrink);

/* The tool row is the transcript's most repeated element, so its two silent
   failure modes are worth pinning: an unlisted tool must still say SOMETHING
   (falling through to the raw name, never to an empty row), and the target
   must be the file name — a full Windows path wraps and the row stops being
   one line, which is the whole point of the rail. */
const sum9 = card9?.querySelector("summary");
check("tool row names the action in Persian",
  sum9?.querySelector(".tool-verb")?.textContent === window.STRINGS.toolVerbs.Write,
  sum9?.querySelector(".tool-verb, .tool-name")?.textContent ?? "no label");

check("tool row shows the file name, not the whole path",
  sum9?.querySelector(".tool-target")?.textContent === "note.md",
  sum9?.querySelector(".tool-target")?.textContent ?? "no target");

check("tool row stays on one line",
  (sum9?.getBoundingClientRect().height ?? 99) < 40,
  Math.round(sum9?.getBoundingClientRect().height ?? 0) + "px");


/* The CLI narrates a stopped turn as a `user` message reading "[Request
   interrupted by user]". Rendered literally it reads as if the user typed an
   English sentence, right next to the Persian «متوقف شد» that already says it. */
const beforeInterrupt = specLog.querySelectorAll(".msg.user").length;
window.renderEvent({ type: "user", message: { content: [
  { type: "text", text: "[Request interrupted by user for tool use]" },
] } });
check("the CLI's English interrupt note never becomes a user bubble",
  specLog.querySelectorAll(".msg.user").length === beforeInterrupt,
  specLog.querySelectorAll(".msg.user").length + " vs " + beforeInterrupt);

/* Case 10 is the moment of consent, and it is now a real diff: the person
   approving an Edit sees the change, not two blobs to compare by eye. The BiDi
   contract is unchanged — the box is LTR, the Persian line inside it is not. */
const permBox = document.querySelector("#perm-params .diff");
const permLine = permBox?.querySelector(".dl.add .dt");
check("case 10: the permission dialog shows an Edit as a diff, per-line direction",
  dirOf(permBox) === "ltr" && dirOf(permLine) === "rtl" &&
  permBox.querySelectorAll(".dl.del").length === 1,
  (permLine?.textContent ?? "no dialog diff") + " -> " + (dirOf(permLine) ?? "none"));

// Dismiss before the DOM dump so the modal backdrop does not sit over #verdict.
window.renderEvent({ type: "wrapper", subtype: "permission_resolved",
                     request_id: "spec10", tool_use_id: "spec10-tool",
                     decision: "deny" });

const out11 = [...specLog.querySelectorAll("details.card.tool:not(.group)")]
  .at(-1)?.querySelector(".card-body > .tool-output");
const lines11 = out11 ? [...out11.children] : [];
check("case 11: tool_result mixes directions line by line",
  dirOf(out11) === "ltr" && dirOf(lines11[0]) === "rtl" && dirOf(lines11[1]) === "ltr",
  lines11.map(dirOf).join(",") || "no tool_result output");

// Rule 8 is per LINE, not per run: a run-level <bdi> would strand these digits
// in their own isolate and reorder them against the Persian around them.
const digitLine = lines11[2];
check("case 12: Latin digits stay inside their Persian line",
  digitLine?.textContent === "\u0645\u0642\u062F\u0627\u0631 42 \u062A\u0646\u0638\u06CC\u0645 \u0634\u062F" &&
  digitLine.children.length === 0 && dirOf(digitLine) === "rtl",
  (digitLine?.textContent ?? "none") + " -> " + (dirOf(digitLine) ?? "none"));

/* Spec rule 3's `line-height: 1.9` is a MINIMUM for Persian, and tool output is
   the one box where it was costing a screen and a half per file listing. It is
   now tightened for the box and restored per line by `:dir(rtl)` — which means
   the floor is no longer a constant anyone can read off the stylesheet, so it
   has to be asserted where it applies: on a real Persian line, next to a real
   Latin one. Ratios, not pixels: this box sets its own font-size. */
const lh = (el) => parseFloat(getComputedStyle(el).lineHeight)
                 / parseFloat(getComputedStyle(el).fontSize);
check("rule 3: a Persian output line keeps the 1.9 floor, a Latin one does not",
  lh(lines11[0]) >= 1.9 && lh(lines11[1]) < 1.9,
  "fa " + lh(lines11[0]).toFixed(2) + " / en " + lh(lines11[1]).toFixed(2));

/* Same rule, the diff box: renderDiff() puts dir="auto" on `.dt` (the text
   span), never on `.dl` (the row) — a selector written against `.dl:dir()`
   has no dir attribute of its own to resolve and silently matches every row
   via the RTL <html> shell instead, regardless of the row's real content.
   `lines9` (from the rule 8 block above) mixes a real Persian line with a
   real Latin one, which is exactly what this needs. */
check("rule 3: a diff's Persian line keeps the 1.9 floor, a Latin one does not",
  lh(lines9[0]) >= 1.9 && lh(lines9[1]) < 1.9,
  "fa " + lh(lines9[0]).toFixed(2) + " / en " + lh(lines9[1]).toFixed(2));

/* An MCP tool has no Persian verb and never will — its name arrives as
   mcp__<server>__<tool>, long enough to fill the rail on its own. The row must
   split it, and the width guard is the point: a textContent check passes just
   as happily on a label that renders clipped.
   Rendered AFTER the checks above, because two of them read `.at(-1)` of the
   tool cards and a new card at the end silently steals their subject. */
window.renderEvent({
  type: "assistant",
  message: { content: [{
    type: "tool_use", id: "spec-mcp", name: "mcp__claude-in-chrome__tabs_context_mcp",
    input: {},
  }] },
});
const sumMcp = [...specLog.querySelectorAll("details.card.tool:not(.group) summary")].at(-1);
check("MCP tool row names the tool and its server separately",
  sumMcp?.querySelector(".tool-name")?.textContent === "tabs_context_mcp" &&
  sumMcp?.querySelector(".tool-server")?.textContent === "claude-in-chrome",
  (sumMcp?.querySelector(".tool-name")?.textContent ?? "no name") + " @ " +
  (sumMcp?.querySelector(".tool-server")?.textContent ?? "no server"));

check("MCP tool row fits on one line, unclipped",
  (sumMcp?.getBoundingClientRect().height ?? 99) < 40 &&
  sumMcp?.scrollWidth <= sumMcp?.clientWidth + 1,
  Math.round(sumMcp?.getBoundingClientRect().height ?? 0) + "px, " +
  sumMcp?.scrollWidth + " vs " + sumMcp?.clientWidth);

/* A subagent has no file, command or pattern to name it, so every Task row used
   to read «کار فرعی» and nothing else — five identical rows for five different
   agents. The agent set is per-machine, so it arrives with `initialize` and the
   description behind it is the CLI's own, not a Persian guess. */
window.renderEvent({
  type: "wrapper", subtype: "init_info",
  info: { agents: [{ name: "Explore", description: "جست‌وجوی فقط-خواندنی" }] },
});
window.renderEvent({
  type: "assistant",
  message: { content: [{
    type: "tool_use", id: "spec-task", name: "Task",
    input: { subagent_type: "Explore", description: "بگرد", prompt: PERSIAN_LINE },
  }] },
});
const sumTask = [...specLog.querySelectorAll("details.card.tool:not(.group) summary")].at(-1);
const taskTarget = sumTask?.querySelector(".tool-target");
check("a subagent row names the agent, described by the CLI",
  taskTarget?.textContent === "Explore" &&
  taskTarget?.title === "جست‌وجوی فقط-خواندنی",
  (taskTarget?.textContent ?? "no target") + " / " + (taskTarget?.title ?? "no title"));

// The name is a Latin identifier on an RTL row: rule 2, isolated like a path.
check("the agent name is LTR-isolated inside the Persian row",
  dirOf(taskTarget) === "ltr" && taskTarget?.tagName === "BDI",
  (taskTarget?.tagName ?? "none") + " / " + (dirOf(taskTarget) ?? "none"));

/* Plan mode: ExitPlanMode carries the plan the user is being asked to consent
   to, written as markdown for a human. Through the ordinary parameter path it
   arrives as a monospace `plan:` blob in an LTR box — which renders, passes any
   textContent assertion, and nobody reads. */
window.renderEvent({
  type: "assistant",
  message: { content: [{
    type: "tool_use", id: "spec-plan", name: "ExitPlanMode",
    input: { plan: "## " + PERSIAN_LINE + "\n\n- گام اول\n- " + PERSIAN_LINE },
  }] },
});
const planCard = [...specLog.querySelectorAll("details.card.tool:not(.group)")].at(-1);
const planBody = planCard?.querySelector(".plan-body");
check("a plan is rendered as markdown, not as a parameter blob",
  !!planBody?.querySelector("h2") && planBody.querySelectorAll("li").length === 2 &&
  !planCard.querySelector(".param-key"),
  planBody ? "h2+" + planBody.querySelectorAll("li").length + "li" : "no .plan-body");

check("the plan's Persian resolves RTL and the row names it in Persian",
  dirOf(planBody?.querySelector("h2")) === "rtl" &&
  planCard?.querySelector(".tool-verb")?.textContent === window.STRINGS.toolVerbs.ExitPlanMode,
  (dirOf(planBody?.querySelector("h2")) ?? "none") + " / " +
  (planCard?.querySelector(".tool-verb, .tool-name")?.textContent ?? "no label"));

/* AskUserQuestion. It arrives over the permission pipe but is a QUESTION, and
   the two failure modes are invisible to a screenshot of a passing run: the
   dialog offering "don't ask again" for a question, and the option labels not
   reaching the inputs' value — that value is the wire format the CLI matches
   against, so a cosmetic-looking change there silently sends the wrong answer. */
const ASK_QUESTIONS = [{
  header: "نوشیدنی",
  question: "چای یا قهوه؟ " + PERSIAN_LINE,
  multiSelect: true,
  options: [{ label: "Tea", description: "چای داغ" }, { label: "قهوه", description: "" }],
}];
window.renderEvent({
  type: "assistant",
  message: { content: [{
    type: "tool_use", id: "spec13", name: "AskUserQuestion",
    input: { questions: ASK_QUESTIONS },
  }] },
});
window.renderEvent({
  type: "wrapper", subtype: "permission_request", request_id: "spec13",
  tool_name: "AskUserQuestion", tool_use_id: "spec13",
  tool_input: { questions: ASK_QUESTIONS },
});

const permDialog = document.getElementById("perm");
check("ask: a question is not an approval — no 'remember this tool' offered",
  permDialog.classList.contains("asking") &&
  getComputedStyle(document.getElementById("perm-remember-row")).display === "none",
  permDialog.className + " / " +
  getComputedStyle(document.getElementById("perm-remember-row")).display);

const askOpts = [...document.querySelectorAll("#perm-ask .ask-opt input")];
check("ask: multiSelect renders checkboxes carrying the option label as value",
  askOpts.length === 2 && askOpts.every(i => i.type === "checkbox") &&
  askOpts.map(i => i.value).join("|") === "Tea|قهوه",
  askOpts.map(i => i.type + ":" + i.value).join(", ") || "no options");

const askText = document.querySelector("#perm-ask .ask-text");
check("ask: a Persian question resolves RTL inside the dialog",
  dirOf(askText) === "rtl" && !!document.querySelector("#perm-ask .ask-free"),
  (dirOf(askText) ?? "none") + " / free-text " +
  (document.querySelector("#perm-ask .ask-free") ? "present" : "MISSING"));

// The transcript half — the only rendering that exists in history replay.
const askCard = specLog.querySelector("details.card.ask .q-options");
check("ask: the transcript shows the options, not raw JSON",
  [...(askCard?.children ?? [])].length === 2 &&
  askCard.textContent.includes("Tea") && !askCard.textContent.includes("{"),
  askCard?.textContent.trim() ?? "no question card");

/* The ANSWERED state, which is what the transcript keeps forever. The answer
   does not ride on the tool_result part — it arrives as `tool_use_result` on
   the EVENT, keyed by the question TEXT, and rendering `content` instead would
   show the model-facing English sentence. Both halves of that are silent
   failures: a wrong key renders «بی‌پاسخ» on a question that WAS answered. */
window.renderEvent({
  type: "user",
  tool_use_result: {
    questions: ASK_QUESTIONS,
    answers: { [ASK_QUESTIONS[0].question]: ["Tea", "قهوه"] },
  },
  message: { content: [{ type: "tool_result", tool_use_id: "spec13", content: "ok" }] },
});
const answer = specLog.querySelector("details.card.ask .q-answer");
check("ask: the answer lands in the question's own card, keyed by question text",
  answer?.querySelector(".q-picked")?.textContent === "Tea، قهوه" &&
  answer?.querySelector(".q-header")?.textContent === "نوشیدنی:" &&
  !specLog.querySelector("details.card.ask .tool-output"),
  (answer?.querySelector(".q-picked")?.textContent ?? "NO ANSWER RENDERED"));

// Mixed script on one line: the Latin label must not drag the Persian header.
check("ask: the answer row resolves RTL from its Persian header",
  dirOf(answer) === "rtl",
  dirOf(answer) ?? "none");

/* Rule 2 where it actually bites: a Latin option label sitting above a Persian
   description. Without the <bdi> the label wins dir="auto" for the whole row and
   drags the Persian text left — which is the exact defect this list would show
   for any English-labelled choice (model names, file names, commands). */
const latinOpt = askCard?.children[0];
check("ask: a Latin option label does not flip its Persian description",
  dirOf(latinOpt) === "rtl" && latinOpt?.querySelector("bdi.q-label")?.textContent === "Tea",
  (dirOf(latinOpt) ?? "none") + " / " +
  (latinOpt?.querySelector("bdi.q-label") ? "isolated" : "NOT isolated"));

window.renderEvent({ type: "wrapper", subtype: "permission_resolved",
                     request_id: "spec13", tool_use_id: "spec13",
                     decision: "allow" });

/* The question the user actually READS, and the one place a BiDi defect is
   unanswerable rather than merely ugly. It is markdown the model wrote, and it
   was assigned as textContent: the backticks of an inline code span printed
   literally, its neutral characters («/price-photo/») reordered against the
   Persian around them, and the whole line flipped LTR off the Latin word it
   opens with. Same three failures, three different layers — one pipeline fixes
   all of them (bidi.js fillInline + autoDir). */
const MD_QUESTIONS = [{
  header: "sitemap",
  question: "Sitemap تصویر شکسته دارد و تازه به `/price-photo/` هم اشاره می‌کند؛ کدام را درست کنیم؟",
  options: [{ label: "sitemap", description: "فقط `/price-photo/` را بردار" },
            { label: "همه", description: "" }],
}];
window.renderEvent({
  type: "wrapper", subtype: "permission_request", request_id: "spec14",
  tool_name: "AskUserQuestion", tool_use_id: "spec14",
  tool_input: { questions: MD_QUESTIONS },
});
const askMd = document.querySelector("#perm-ask .ask-text");
check("ask: the dialog's question is rendered markdown, not a raw string",
  askMd?.querySelector("code")?.getAttribute("dir") === "ltr" &&
  !askMd.textContent.includes("`"),
  askMd?.querySelector("code")
    ? "code dir=" + askMd.querySelector("code").getAttribute("dir")
    : "NO code span — question rendered as text");

check("ask: a Persian question opening with a Latin word still reads RTL",
  dirOf(askMd) === "rtl" && askMd.getAttribute("dir") === "rtl",
  (dirOf(askMd) ?? "no question") + " / attr " +
  (askMd?.getAttribute("dir") ?? "none"));

// The description under an option is the same prose in a smaller box, and the
// row must still read it — the <bdi> label is invisible to the decision.
const mdDesc = document.querySelector("#perm-ask .ask-desc");
check("ask: an option description is markdown too, and its row reads RTL",
  !!mdDesc?.querySelector("code") &&
  dirOf(mdDesc.closest(".ask-opt-text")) === "rtl",
  (mdDesc ? (mdDesc.querySelector("code") ? "code span" : "PLAIN TEXT") : "no description")
  + " / " + (dirOf(mdDesc?.closest(".ask-opt-text")) ?? "none"));

// Whatever the question renders as, the wire value stays the RAW label — that
// string is what the CLI matches the answer against.
check("ask: the option input still carries the raw label as its value",
  [...document.querySelectorAll("#perm-ask .ask-opt input")]
    .map(i => i.value).join("|") === "sitemap|همه",
  [...document.querySelectorAll("#perm-ask .ask-opt input")]
    .map(i => i.value).join("|") || "no options");

/* Enter on a typed free-text answer must SUBMIT it. Implicit form submission
   clicks the form's default button — the tree-first submit button, which is
   #perm-deny — so «جواب دیگر» plus Enter used to leave the dialog as a skip:
   an allow with an EMPTY answer set, and the CLI told the model "the user did
   not answer" while the form sat fully filled in. The check reads the wire —
   what /api/permission/respond was actually handed — because every rendered
   pixel of that failure looks correct. */
const freeField = document.querySelector("#perm-ask .ask-free");
freeField.value = "هیچ‌کدام، فقط عکس را بردار";
let askSent = null;
const fetchBeforeAsk = window.fetch;
window.fetch = (url, opts) => {
  askSent = { url: String(url), body: JSON.parse(opts?.body ?? "{}") };
  return Promise.resolve({ ok: true });
};
freeField.dispatchEvent(new KeyboardEvent("keydown",
  { key: "Enter", bubbles: true, cancelable: true }));
window.fetch = fetchBeforeAsk;
check("ask: Enter on a typed free-text answer sends it, not a skip",
  !!askSent && askSent.url.startsWith("/api/permission/respond")
  && askSent.body.decision === "allow"
  && askSent.body.answers?.[MD_QUESTIONS[0].question] === "هیچ‌کدام، فقط عکس را بردار",
  askSent ? JSON.stringify(askSent.body.answers ?? {})
          : "NOTHING SENT — implicit submit reached the default (skip) button");

window.renderEvent({ type: "wrapper", subtype: "permission_resolved",
                     request_id: "spec14", tool_use_id: "spec14",
                     decision: "allow" });

/* The context notice. Driven by the number the CLI measures, so the check is
   "does a usage event above the threshold produce the two actions" — and that
   the percentage is written in Persian digits, since it is prose (rule 5). */
const ctx = document.getElementById("context-notice");
window.renderEvent({ type: "wrapper", subtype: "usage", context: 40 });
check("context notice stays away while there is room", ctx.hidden);

window.renderEvent({ type: "wrapper", subtype: "usage", context: 91 });
const ctxBtns = [...ctx.querySelectorAll(".ctx-btn .ctx-btn-text")].map(b => b.textContent);
check("context notice offers compact AND clear, plus a way out",
  !ctx.hidden && ctxBtns.length === 3 &&
  ctxBtns[0] === window.STRINGS.ctxCompact && ctxBtns[1] === window.STRINGS.ctxClear,
  ctxBtns.join(" | ") || "no actions");
check("context percentage is written in Persian digits (rule 5)",
  ctx.querySelector(".ctx-body")?.textContent === "۹۱٪ از حافظه گفتگو استفاده شده است.",
  ctx.querySelector(".ctx-body")?.textContent ?? "no body");

// A compact or a clear drops the number; the notice must let go by itself.
window.renderEvent({ type: "wrapper", subtype: "usage", context: 12 });
check("context notice clears itself once the conversation shrinks", ctx.hidden);

/* The CLI's WARNING phrasings, verbatim out of the shipped bundle (2026-08-18).
   Both used to raise the non-dismissible «حافظه گفتگو پر شد» panel, which the
   next healthy percentage then took away again — a notice that appears mid-work
   and vanishes by itself reads as a malfunction. Neither says "/compact or
   /clear"; that phrase belongs only to the two fatal messages, which is exactly
   what makes it safe to keep as the drift catch-all in CONTEXT_EXHAUSTED. */
for (const warning of [
  "Context low (12% remaining) · Run /compact to compact & continue",
  "Context is 3000 tokens past the 200000-token compaction window — run /compact to continue.",
]) {
  window.renderEvent({ type: "result", subtype: "error_during_execution",
                       is_error: true, usage: {}, result: warning });
}
check("a context WARNING from the CLI never raises the exhausted panel",
  ctx.hidden,
  ctx.hidden ? "quiet" : "SHOWED: " + (ctx.querySelector(".ctx-title")?.textContent ?? "?"));

// The hard limit arrives as a failed turn with no percentage at all.
window.renderEvent({
  type: "result", subtype: "error_during_execution", is_error: true,
  result: "Context exceeds the 200000-token limit by 5000 tokens — run /compact or /clear to continue.",
});
check("the CLI's own English limit message raises the Persian notice",
  !ctx.hidden && ctx.classList.contains("urgent") &&
  ctx.querySelectorAll(".ctx-btn").length === 2,
  ctx.hidden ? "hidden" : ctx.className + " / " + ctx.querySelectorAll(".ctx-btn").length + " actions");
ctx.hidden = true;

/* pcg-3nm / T4: the `result` event's own context "estimate" computed
   Object.values(modelUsage)[0].contextWindow as the denominator against
   usage summed across EVERY model in the map. modelUsage is cumulative
   across the whole session (main loop, subagents, sidechains, compaction —
   control-protocol.md §10) and keyed in insertion order, not by which model
   is actually running the turn — so a session on a 1M-window model that
   ever touched a 200k-class model read 100%+ and raised the notice, only to
   self-correct minutes later once wrapper/usage's real percentage arrived.
   The fix deletes the estimate outright: the meter must keep its last real
   (wrapper/usage) value between turns, not be repainted by `result` at all. */
const statusline = document.getElementById("statusline");
function ctxMeterValue() {
  return [...statusline.querySelectorAll(".sl-item")]
    .find(i => i.querySelector(".sl-label")?.textContent === window.STRINGS.slContext + ":")
    ?.querySelector("progress")?.value;
}
window.renderEvent({ type: "wrapper", subtype: "usage", context: 55 });
check("context notice stays away at a real, moderate percentage", ctx.hidden);
const ctxMeterBefore = ctxMeterValue();
window.renderEvent({
  type: "result", subtype: "success",
  usage: { input_tokens: 82000, cache_read_input_tokens: 200000,
           cache_creation_input_tokens: 0 },  // 282000 tokens total
  modelUsage: {
    // First-inserted key: a 200k-class model the session merely touched.
    // 282000 / 200000 = 141% under the old (deleted) arithmetic.
    "claude-3-5-haiku-20241022": { contextWindow: 200000 },
    // The model actually running the turn — true load is ~28%.
    "claude-opus-5[1m]": { contextWindow: 1000000 },
  },
});
check("a result event whose old arithmetic reads 141% raises no notice",
  ctx.hidden,
  ctx.hidden ? "quiet" : "SHOWED: " + (ctx.querySelector(".ctx-title")?.textContent ?? "?"));
check("the result event did not touch the status meter's context value",
  ctxMeterValue() === ctxMeterBefore,
  ctxMeterBefore + "% before / " + ctxMeterValue() + "% after");
ctx.hidden = true;

/* Markdown tables. marked emitted them all along; with no CSS at all a <table>
   is borderless and gap-less, so a comparison grid read as loose columns of
   text. `table` AND `th` both carry dir=auto (bidi.js BLOCK_TAGS) — every
   content-bearing element resolves its own direction (rule 1), same as `td`.
   One consequence: once every cell has its own dir, the table's OWN dir=auto
   scan (which explicitly skips descendant text that carries its own dir) has
   nothing left to read and falls back to its ltr default, so `<table>` no
   longer picks column order from the header's language — see bidi.js. */
window.renderEvent({
  type: "assistant",
  message: { content: [{ type: "text", text:
    "| Entity | Count |\n|---|---|\n| Orders | 28 |\n| " + PERSIAN_LINE + " | 9 |" }] },
});
const tbl = [...specLog.querySelectorAll(".msg table")].at(-1);
const th0 = tbl?.querySelector("th");
check("a markdown table renders as a table, bordered and gridded",
  !!tbl && tbl.parentElement?.className === "table-wrap" &&
  getComputedStyle(th0).borderBottomStyle === "solid" &&
  getComputedStyle(tbl).borderCollapse === "collapse",
  tbl ? tbl.parentElement.className + " / " + getComputedStyle(th0).borderBottomStyle
      : "no table");

// A Latin header means column 1 is on the LEFT, even inside the RTL shell; the
// Persian data cell still reads right-to-left inside its own box.
check("an English table keeps its column order, a Persian cell keeps its own",
  getComputedStyle(tbl).direction === "ltr" &&
  getComputedStyle([...tbl.querySelectorAll("td")].at(-2)).direction === "rtl",
  getComputedStyle(tbl).direction + " table, " +
  getComputedStyle([...tbl.querySelectorAll("td")].at(-2)).direction + " persian cell");

/* A genuinely mixed-language header row — a prior edit added `table` to
   BLOCK_TAGS but dropped `th` in the same diff, so a header cell lost its own
   direction and inherited the table's single resolved value instead. An
   all-Latin header (above) cannot catch this: it resolves ltr either way. */
window.renderEvent({
  type: "assistant",
  message: { content: [{ type: "text", text:
    "| Command | " + "توضیح" + " |\n|---|---|\n| git status | " + PERSIAN_LINE + " |" }] },
});
const tbl2 = [...specLog.querySelectorAll(".msg table")].at(-1);
const th2 = [...(tbl2?.querySelectorAll("th") ?? [])];
check("a mixed-language table header resolves each th independently",
  dirOf(th2[0]) === "ltr" && dirOf(th2[1]) === "rtl",
  th2.map(dirOf).join(",") || "no header cells");

/* Lists, where the same rule 1 heuristic bites at a scope too small to mean
   anything. dir="auto" per <li> resolved each bullet on its OWN first strong
   character, so one item opening with an inline `code` span went LTR while its
   Persian siblings stayed RTL — markers down both sides of one list and the
   Persian sentence's final «.» stranded on the wrong end. The list is the
   block that decides (bidi.js). Computed direction only: textContent is
   logical order and reads identically either way. */
window.renderEvent({
  type: "assistant",
  message: { content: [{ type: "text", text:
    "- " + PERSIAN_LINE + "\n- `wp/v2/brand` وجود ندارد\n- ۴۰۴ هم همین‌طور" }] },
});
const faList = [...specLog.querySelectorAll(".msg ul")].at(-1);
const faItems = [...(faList?.querySelectorAll("li") ?? [])];
check("a Persian list keeps one direction, even where an item opens in Latin",
  dirOf(faList) === "rtl" && faItems.length === 3 &&
  faItems.every(li => dirOf(li) === "rtl" && !li.hasAttribute("dir")),
  (dirOf(faList) ?? "no list") + " list / " + faItems.map(dirOf).join(","));

/* The half the check above could not see: the code-opening item in FIRST
   position. The list's own dir="auto" scans in tree order and does not skip a
   <code> subtree, so the opening Latin token decided for the whole list and
   every item went LTR — the user's report, with a green gate. <code dir="ltr">
   is what removes it from the scan (bidi.js). */
window.renderEvent({
  type: "assistant",
  message: { content: [{ type: "text", text:
    "- `seasonOf(ts)` " + PERSIAN_LINE + "\n- " + PERSIAN_LINE + "\n- ۴۰۴ هم همین‌طور" }] },
});
const codeFirst = [...specLog.querySelectorAll(".msg ul")].at(-1);
const codeFirstItems = [...(codeFirst?.querySelectorAll("li") ?? [])];
check("a Persian list whose FIRST item opens with `code` still reads right-to-left",
  dirOf(codeFirst) === "rtl" && codeFirstItems.length === 3 &&
  codeFirstItems.every(li => dirOf(li) === "rtl"),
  (dirOf(codeFirst) ?? "no list") + " list / " + codeFirstItems.map(dirOf).join(","));

// A paragraph is the same block with the same scan: it opens with a code span
// far more often than a list does, and it broke the same silent way.
window.renderEvent({
  type: "assistant",
  message: { content: [{ type: "text", text: "`foldSessions()` " + PERSIAN_LINE }] },
});
const codePara = [...specLog.querySelectorAll(".msg p")].at(-1);
check("a Persian paragraph opening with `code` resolves RTL, not off the code",
  dirOf(codePara) === "rtl", dirOf(codePara) ?? "no paragraph");

/* The same block, one layer down again: the first token is a bare Latin WORD,
   which carries no dir and cannot be given one — it is ordinary prose. This is
   the user's screenshot, verbatim in shape: a paragraph that is overwhelmingly
   Persian, opening with the product name it is about, rendered left-to-right
   with its Persian trailing off the wrong edge. dir="auto" is first-strong and
   first-strong is wrong for this content; the count is what fixes it. */
window.renderEvent({
  type: "assistant",
  message: { content: [{ type: "text", text:
    "Object Cache با Redis کانفیگ شده — ولی یک ایراد در تنظیمات دارد که باید درست شود." }] },
});
const latinFirstPara = [...specLog.querySelectorAll(".msg p")].at(-1);
check("a majority-Persian paragraph opening with a Latin word resolves RTL",
  dirOf(latinFirstPara) === "rtl" && latinFirstPara.getAttribute("dir") === "rtl",
  (dirOf(latinFirstPara) ?? "no paragraph") + " / attr " +
  (latinFirstPara?.getAttribute("dir") ?? "none"));

/* The other side of the same measurement, and the reason the rule is one-way:
   an English paragraph quoting one short Persian phrase is still English. It
   keeps dir="auto" — the browser decides it, nothing is forced — which is what
   stops this from becoming the hardcoded `direction: rtl` the spec calls a
   non-solution. */
window.renderEvent({
  type: "assistant",
  message: { content: [{ type: "text", text:
    "The user typed «سلام» into the composer and the round-trip kept it intact." }] },
});
const enQuotePara = [...specLog.querySelectorAll(".msg p")].at(-1);
check("an English paragraph quoting a short Persian phrase stays LTR",
  dirOf(enQuotePara) === "ltr" && enQuotePara.getAttribute("dir") === "auto",
  (dirOf(enQuotePara) ?? "no paragraph") + " / attr " +
  (enQuotePara?.getAttribute("dir") ?? "none"));

/* The half NEITHER of those can see: a first item that opens with a bare Latin
   WORD. `<code dir="ltr">` cannot help there — a plain word carries no dir and
   is exactly what dir="auto" is built to read — so first-strong flipped the
   whole list on the most ordinary content this app renders (a product name, a
   file name, a table name at the head of a Persian bullet). The count is what
   answers it: three Persian items outvote one Latin word. */
window.renderEvent({
  type: "assistant",
  message: { content: [{ type: "text", text:
    "- Redis کانفیگ شده ولی کار نمی‌کند\n- " + PERSIAN_LINE + "\n- ۴۰۴ هم همین‌طور" }] },
});
const latinFirst = [...specLog.querySelectorAll(".msg ul")].at(-1);
const latinFirstItems = [...(latinFirst?.querySelectorAll("li") ?? [])];
check("a Persian list whose FIRST item opens with a Latin word still reads RTL",
  dirOf(latinFirst) === "rtl" && latinFirstItems.length === 3 &&
  latinFirstItems.every(li => dirOf(li) === "rtl"),
  (dirOf(latinFirst) ?? "no list") + " list / " + latinFirstItems.map(dirOf).join(","));

// The other half of that trade, and the reason this is `dir="auto"` on the list
// rather than the `direction: rtl` it would be tempting to hardcode: an English
// list inside the RTL shell still has to read left-to-right (spec's first trap).
// The fixture carries a Persian item ON PURPOSE — it is the LTR side of the
// count, so a Persian minority must not drag an English list over. (It used to
// be one English item against one Persian one, which under a majority rule is
// not an English list at all: 13 Persian letters to 9 Latin.)
window.renderEvent({
  type: "assistant",
  message: { content: [{ type: "text", text:
    "- first item, written in English\n- second line, also English\n- " + PERSIAN_LINE }] },
});
const enList = [...specLog.querySelectorAll(".msg ul")].at(-1);
check("an English list still reads left-to-right — the list decides, nothing is forced",
  dirOf(enList) === "ltr" && enList !== faList,
  dirOf(enList) ?? "no list");

/* Raw HTML in a message. marked v15 emits html tokens VERBATIM — it dropped its
   sanitizer on purpose — and both halves of this transcript are untrusted text:
   the model writes one, the user pastes the other. A user pasted code
   containing CSS and the <style> block inside it restyled the entire window
   (reported); <img onerror> is the same hole with script on the end of it,
   inside a page that holds the session token. Raw HTML now renders as the text
   it always was (bidi.js). Element counts, not textContent alone: an injected
   node is a STRUCTURAL defect, and "the literal text is visible" is only the
   second half of the assertion. */
window.renderEvent({
  type: "assistant",
  message: { content: [{ type: "text", text:
    "<style>#x{display:none}</style>\n\nاین متن بعد از استایل است." }] },
});
const styleMsg = [...specLog.querySelectorAll(".msg.assistant")].at(-1);
check("a pasted <style> block is escaped, never injected into the page",
  specLog.querySelectorAll("style, link").length === 0 &&
  styleMsg.textContent.includes("<style>#x{display:none}</style>"),
  specLog.querySelectorAll("style, link").length + " injected node(s) / " +
  (styleMsg.textContent.includes("<style>") ? "literal text kept" : "TEXT LOST"));

window.renderEvent({
  type: "assistant",
  message: { content: [{ type: "text", text:
    "تصویر <img src=x onerror=1> در متن پیام." }] },
});
const imgMsg = [...specLog.querySelectorAll(".msg.assistant")].at(-1);
check("an inline <img onerror> never becomes an element",
  specLog.querySelectorAll("img").length === 0 &&
  imgMsg.textContent.includes("<img src=x onerror=1>"),
  specLog.querySelectorAll("img").length + " <img> in the log / " +
  (imgMsg.textContent.includes("<img") ? "literal text kept" : "TEXT LOST"));

// The other side of the same override: a fenced block and an inline span are
// `code` tokens, not `html` ones, and must render exactly as before.
window.renderEvent({
  type: "assistant",
  message: { content: [{ type: "text", text:
    "```html\n<b>bold</b>\n```\n\nو `<i>x</i>` در متن." }] },
});
const codeMsg = [...specLog.querySelectorAll(".msg.assistant")].at(-1);
check("escaping raw HTML left fenced and inline code untouched",
  codeMsg.querySelector("pre code")?.textContent.trim() === "<b>bold</b>" &&
  codeMsg.querySelector("p code")?.textContent === "<i>x</i>" &&
  codeMsg.querySelectorAll("b, i").length === 0,
  (codeMsg.querySelector("pre code")?.textContent.trim() ?? "no fence") + " / " +
  (codeMsg.querySelector("p code")?.textContent ?? "no span"));

/* Consecutive tool calls fold into one row, as the CLI's own transcript does.
   The count is the assertion a textContent check on the cards cannot make: it
   has to say «۲ فرمان اجرا شد» in Persian digits, and the cards themselves must
   still be present inside — grouping that DROPPED a card would look identical
   from the outside. */
for (const cmd of ["git status", "git log"]) {
  window.renderEvent({
    type: "assistant",
    message: { content: [{ type: "tool_use", id: "g-" + cmd, name: "Bash",
                           input: { command: cmd } }] },
  });
}
window.renderEvent({
  type: "assistant",
  message: { content: [{ type: "tool_use", id: "g-read", name: "Read",
                         input: { file_path: "C:\\x\\a.txt" } }] },
});
const group = [...specLog.querySelectorAll("details.card.group")].at(-1);
check("a run of tool calls collapses into one counted row",
  group?.querySelector("summary .tool-verb")?.textContent === "۲ فرمان اجرا شد، ۱ فایل خوانده شد" &&
  group?.querySelectorAll(":scope > .card-body > details.card").length === 3 &&
  !group.open,
  (group?.querySelector("summary .tool-verb")?.textContent ?? "no group") + " / " +
  (group?.querySelectorAll(":scope > .card-body > details.card").length ?? 0) + " cards");

// A sentence between two calls ends the run — that is what makes the group mean
// "these happened together" rather than "these are the same tool".
window.renderEvent({ type: "assistant", message: { content: [{ type: "text", text: "تمام." }] } });
window.renderEvent({
  type: "assistant",
  message: { content: [{ type: "tool_use", id: "g-after", name: "Bash",
                         input: { command: "echo done" } }] },
});
check("a sentence between calls ends the run",
  [...specLog.querySelectorAll("details.card.group")].at(-1) === group &&
  specLog.lastElementChild?.dataset.tool === "Bash",
  specLog.lastElementChild?.tagName + "/" + (specLog.lastElementChild?.dataset.tool ?? "-"));

/* A grouped run of MCP calls used to fall through to the raw forty-character
   identifier (mcp__server__tool) — toolSummary() below was specifically
   changed to split that into a name + server chip (bead pcg-9jx), but
   groupSummaryText() never got the same treatment. A fresh sentence first, so
   this group's count is not diluted by the Bash call above it. */
window.renderEvent({ type: "assistant", message: { content: [{ type: "text", text: "دوباره." }] } });
for (let i = 0; i < 2; i++) {
  window.renderEvent({
    type: "assistant",
    message: { content: [{ type: "tool_use", id: "g-mcp" + i,
                           name: "mcp__claude-in-chrome__tabs_context_mcp", input: {} }] },
  });
}
const groupMcp = [...specLog.querySelectorAll("details.card.group")].at(-1);
const groupMcpVerb = groupMcp?.querySelector("summary .tool-verb");
check("a grouped run of MCP calls shows the short tool name, not the raw identifier",
  groupMcpVerb?.textContent === "۲ tabs_context_mcp" &&
  !groupMcpVerb.textContent.includes("mcp__"),
  groupMcpVerb?.textContent ?? "no group");

// Not a BiDi rule, but the same class of silent failure as the rest of this
// file: a raw identifier long enough to overflow the row needs the same
// one-line ellipsis guard the singular MCP row already has, or it just
// spills out of the box instead of being clipped.
check("the grouped MCP summary ellipses instead of overflowing the row",
  !!groupMcpVerb &&
  getComputedStyle(groupMcpVerb).textOverflow === "ellipsis" &&
  getComputedStyle(groupMcpVerb).overflow === "hidden",
  groupMcpVerb
    ? getComputedStyle(groupMcpVerb).textOverflow + " / " + getComputedStyle(groupMcpVerb).overflow
    : "no element");

/* THE FRAME IS DRIVEN BY HAND, and it has to be. The renderer coalesces its
   stream paint onto requestAnimationFrame, so every check that streams needs one
   frame to have happened — but this page runs under `msedge --headless=new
   --virtual-time-budget`, and that combination serves a handful of real
   animation frames and then none at all (measured: the fourth rAF of the run
   never fired, the harness hung on it, and the runner reported the whole
   verdict as empty — a module-load error and a missing frame look identical
   from outside). Waiting for a frame is therefore not a gate, it is a coin
   toss, and one that fails CLOSED in the noisiest possible way.

   `requestAnimationFrame` is resolved off `window` at call time, so holding the
   renderer's own callback and running it here exercises the same code path with
   no frame involved — and synchronously, which keeps the verdict written in one
   task the way every other check in this file is. Restored at the end.

   The stub must stand BEFORE the first event that touches the paint queue —
   which is the thinking case below, not the text-stream cases further down. A
   paint queued on the REAL rAF pins the renderer's one-callback guard
   (paintFrame) to an id that may never fire under virtual time, and every
   stream write after the swap then waits on it forever. */
const frameQueue = [];
const realRaf = window.requestAnimationFrame;
window.requestAnimationFrame = (fn) => frameQueue.push(fn);   // a truthy id
const flushFrame = () => {
  for (const fn of frameQueue.splice(0)) fn(performance.now());
};

/* Interleaved thinking: the model thinks between every call, so a thinking card
   that ENDED the run shattered a fifteen-step turn into fifteen groups of one,
   each separated by an identical, content-free «در حال فکر کردن» row. Thinking
   joins the run instead — and must NOT be counted in the summary, which reports
   actions. Both halves are invisible to a textContent check on the cards: a
   thinking card that broke the run and one that joined it hold the same text. */
window.renderEvent({ type: "assistant", message: { content: [{ type: "text", text: "شروع." }] } });
const thought = (t) => window.renderEvent(
  { type: "stream_event", event: { type: "content_block_delta", delta: { thinking: t } } });
thought("First I check the repo state.");
window.renderEvent({ type: "assistant", message: { content: [{ type: "tool_use",
  id: "th-1", name: "Bash", input: { command: "git status" } }] } });
thought("Now the log.");
window.renderEvent({ type: "assistant", message: { content: [{ type: "tool_use",
  id: "th-2", name: "Bash", input: { command: "git log" } }] } });
const thGroup = [...specLog.querySelectorAll("details.card.group")].at(-1);
const thVerb = thGroup?.querySelector(":scope > summary .tool-verb")?.textContent;
check("thinking joins the run instead of shattering it into one group per call",
  thGroup !== groupMcp && thVerb === "۲ فرمان اجرا شد" &&
  thGroup?.querySelectorAll(":scope > .card-body > details.card").length === 4 &&
  specLog.querySelectorAll(":scope > details.card.thinking").length === 0,
  (thVerb ?? "no group") + " / " +
  (thGroup?.querySelectorAll(":scope > .card-body > details.card").length ?? 0) + " inside / " +
  specLog.querySelectorAll(":scope > details.card.thinking").length + " loose");

// Shut, every thinking row carried the same word and nothing else. The opening
// clause of the thought is the only thing that tells two of them apart.
const thPeek = thGroup?.querySelector(".thinking > summary .tool-target")?.textContent;
check("a collapsed thinking row previews its own thought, not just the word",
  thPeek?.startsWith("First I check the repo state."),
  thPeek ?? "no preview");

// The O(n²) guard, thinking edition: deltas accumulate in state and the body
// is written once per frame. A renderer that writes textContent per delta
// shows the text before any frame has run — the same defect class the
// text-stream case below pins, on the branch that used to have it.
const thBodies = [...(thGroup?.querySelectorAll(".thinking > .card-body") ?? [])];
const thEarly = thBodies.map((b) => b.textContent).join("");
flushFrame();
check("a thinking card paints once per frame, not once per delta",
  thEarly === "" && thBodies.length === 2 &&
  thBodies[0].textContent === "First I check the repo state." &&
  thBodies[1].textContent === "Now the log.",
  "before the frame: «" + thEarly.slice(0, 20) + "», after: «" +
  (thBodies[0]?.textContent ?? "none") + "» / «" +
  (thBodies[1]?.textContent ?? "none") + "»");

/* The turn's pulse. Three things here are invisible to a textContent read and
   each one has already been a defect class in this file: that the line is
   LAST while the turn runs (it is appended FIRST — only `order: 1` puts it at
   the end, and a settle that forgets to move it snaps the closing line back
   above its own turn), that its counters are written in Persian digits inside
   Persian prose (rule 5), and that it settles rather than lingering as a
   stopwatch nobody stopped. */
/* One command reaching a terminal state, the way the CLI reports it. A
   `result` is a TURN boundary and no longer the end of anything: a mid-turn
   send is FOLDED into the running turn and never gets a result of its own, so
   N sends can produce ONE result (2.1.241, measured). What ends a batch is the
   uuid we sent coming back on `command_lifecycle`, which is why every fixture
   below that finishes a turn has to say both — exactly as the server does. */
const doneCmd = (uuid) => window.renderEvent(
  { type: "command_lifecycle", command_uuid: uuid, state: "completed" });

window.renderEvent({ type: "wrapper", subtype: "user_echo",
                     text: "سلام", uuid: "cmd-solo" });
const pulse = specLog.querySelector(".pulse");
const pulseCard = (() => {
  window.renderEvent({ type: "assistant", message: { content: [{ type: "tool_use",
    id: "p-1", name: "Bash", input: { command: "sleep 1" } }],
    usage: { output_tokens: 10_900 } } });
  return specLog.lastElementChild;
})();
check("the pulse is pinned last while the turn runs, though it was appended first",
  !!pulse && pulse.classList.contains("live") &&
  getComputedStyle(pulse).order === "1" && getComputedStyle(pulseCard).order === "0" &&
  pulse.compareDocumentPosition(pulseCard) === Node.DOCUMENT_POSITION_FOLLOWING,
  pulse ? "order " + getComputedStyle(pulse).order + " vs card "
          + getComputedStyle(pulseCard).order : "no pulse");

// The turn's result, and it settles NOTHING on its own: the command we sent is
// still open, and a window that closed the line here would drop the stop button
// while a message folded into that turn was still to be answered.
window.renderEvent({ type: "result", subtype: "success", usage: {}, result: "ok" });
check("a result alone leaves the line running: the command has not closed yet",
  pulse.classList.contains("live") && document.body.classList.contains("busy"),
  (pulse.classList.contains("live") ? "live" : "SETTLED on the result alone") +
  " / " + (document.body.classList.contains("busy") ? "busy" : "idle"));

// Persian prose, so Persian digits — and the token figure is the CLI's own, not
// a guess: 10 900 has to read «۱۰٫۹ هزار», not «10.9k».
doneCmd("cmd-solo");
const pulseText = pulse?.textContent ?? "";
check("the pulse settles into the turn's closing line, counted in Persian digits",
  !pulse.classList.contains("live") &&
  /^[^۰-۹]*—\s*[۰-۹]/.test(pulse.querySelector(".pulse-verb").textContent) &&
  pulseText.includes("۱۰٫۹ هزار توکن") && !/[0-9]/.test(pulseText),
  pulseText.replace(/\s+/g, " ").trim() || "empty");

// Settled, it is the LAST thing in the turn — the record of what just happened,
// not a header sitting above the work it describes.
check("the settled line ends the turn instead of snapping back above it",
  specLog.lastElementChild === pulse && getComputedStyle(pulse).order === "0",
  specLog.lastElementChild?.className + " / order " + getComputedStyle(pulse).order);

/* Queued sends: the CLI queues a mid-turn message and answers EACH message
   with its own result event, keeping one spinner over the whole queue. Two
   defect shapes guarded here: the orphaned pulse (clearPulse() used to null
   state.pulse without touching the DOM, so every extra send left the previous
   "still working" row behind, breathing forever) and the early settle (one
   result used to settle the pulse and hide the stop button while queued turns
   were still running). Isolated in its own render target (the seam
   withRenderTarget()/newRenderScope() exist for) so the already-settled pulse
   above — a real transcript entry — cannot be mistaken for a leak by a bare
   specLog query. */
const pulseScoped = document.createElement("div");
const pulseScope = newRenderScope();
withRenderTarget(pulseScoped, pulseScope, () => {
  window.renderEvent({ type: "wrapper", subtype: "user_echo",
                       text: "اول", uuid: "cmd-q1" });
  window.renderEvent({ type: "wrapper", subtype: "user_echo",
                       text: "دوم", uuid: "cmd-q2" });
});
check("a second send mid-turn joins the one status line instead of stacking another",
  pulseScoped.querySelectorAll(".pulse.live").length === 1 &&
  pulseScoped.querySelectorAll(".pulse").length === 1,
  pulseScoped.querySelectorAll(".pulse.live").length + " live / " +
  pulseScoped.querySelectorAll(".pulse").length + " total");

withRenderTarget(pulseScoped, pulseScope, () => {
  window.renderEvent({ type: "result", subtype: "success", usage: {}, result: "ok" });
  doneCmd("cmd-q1");
});
check("the first result of a two-message queue leaves the status line running",
  pulseScoped.querySelectorAll(".pulse.live").length === 1 &&
  pulseScoped.querySelectorAll(".pulse").length === 1,
  pulseScoped.querySelectorAll(".pulse.live").length + " live / " +
  pulseScoped.querySelectorAll(".pulse").length + " total");

withRenderTarget(pulseScoped, pulseScope, () => {
  window.renderEvent({ type: "result", subtype: "success", usage: {}, result: "ok" });
  doneCmd("cmd-q2");
});
check("the last command of the queue settles its one pulse into one closing line",
  pulseScoped.querySelectorAll(".pulse.live").length === 0 &&
  pulseScoped.querySelectorAll(".pulse").length === 1 &&
  pulseScope.outstanding.size === 0,
  pulseScoped.querySelectorAll(".pulse.live").length + " live / " +
  pulseScoped.querySelectorAll(".pulse").length + " total / ledger " +
  pulseScope.outstanding.size);

/* The 2.1.241 shape, and the reported defect itself: a message sent mid-turn is
   FOLDED into the running turn and never runs as its own, so two sends produce
   ONE result — and the folded command reports finished BEFORE that result,
   while the turn's own reports after it. A window counting results is stuck at
   "working" from here to the end of the session; a window keyed on the uuids it
   sent settles exactly once. Both orders are driven here because both are what
   the CLI does. */
const foldScoped = document.createElement("div");
const foldScope = newRenderScope();
withRenderTarget(foldScoped, foldScope, () => {
  window.renderEvent({ type: "wrapper", subtype: "user_echo",
                       text: "سؤال", uuid: "cmd-f1" });
  window.renderEvent({ type: "wrapper", subtype: "user_echo",
                       text: "و یک نکته", uuid: "cmd-f2" });
  doneCmd("cmd-f2");                       // folded: reports BEFORE the result
  window.renderEvent({ type: "result", subtype: "success", usage: {}, result: "ok" });
});
check("two sends answered by ONE result do not settle while a command is open",
  foldScoped.querySelectorAll(".pulse.live").length === 1 &&
  document.body.classList.contains("busy"),
  foldScoped.querySelectorAll(".pulse.live").length + " live / " +
  (document.body.classList.contains("busy") ? "busy" : "IDLE mid-turn"));

withRenderTarget(foldScoped, foldScope, () => {
  doneCmd("cmd-f1");                       // the turn's own: AFTER the result
  // The CLI reports commands of its own too (a cron trigger, a teammate's
  // prompt, a deferred turn resuming). This window never sent them and must
  // not act on them.
  doneCmd("cmd-nobody-sent");
});
check("one result for two sends still settles once, on the last uuid we sent",
  foldScoped.querySelectorAll(".pulse.live").length === 0 &&
  foldScoped.querySelectorAll(".pulse").length === 1 &&
  !document.body.classList.contains("busy"),
  foldScoped.querySelectorAll(".pulse").length + " pulse rows, " +
  foldScoped.querySelectorAll(".pulse.live").length + " still live / " +
  (document.body.classList.contains("busy") ? "STILL busy" : "idle"));

/* The idle hint. An hour of silence suggests a fresh chat through the same
   context notice — no compact button (nothing is over any limit), fresh chat
   takes the primary style. checkIdle takes `now` so the hour needs no waiting.
   It sits AFTER the pulse cases on purpose: their unscoped user_echo/result
   turn is what stamps the activity clock through the shipping setBusy path —
   earlier in this file no turn has run and the hint must stay away. */
window.renderEvent({ type: "wrapper", subtype: "usage", context: 12 });  // let go of the urgent state
window.checkIdle(Date.now() + 61 * 60 * 1000);
const idleBtns = [...ctx.querySelectorAll(".ctx-btn .ctx-btn-text")].map(b => b.textContent);
check("an hour of silence suggests a fresh chat, without the compact button",
  !ctx.hidden && ctx.querySelector(".ctx-title")?.textContent === window.STRINGS.idleTitle &&
  idleBtns.length === 2 && idleBtns[0] === window.STRINGS.ctxClear,
  ctx.hidden ? "hidden" : idleBtns.join(" | ") || "no actions");
ctx.hidden = true;

/* The delete row in a ⋯ menu is a <button>, so the filled `button.danger` rule
   painted it coral while `.kebab-item.danger` set the text coral too — a blank
   slab, and the armed state was the quieter of the two. Colour is exactly what
   a textContent assertion cannot see. */
const kb = document.createElement("div");
kb.className = "kebab-menu";
kb.style.cssText = "position:absolute;inset-inline-start:-9999px";
const kbRow = document.createElement("button");
kbRow.className = "kebab-item danger";
// `button` transitions its background, so a computed read right after arming
// samples the transition at t=0 and every colour looks transparent.
kbRow.style.transition = "none";
kbRow.textContent = "حذف";
kb.append(kbRow);
document.body.append(kb);
const kbIdle = getComputedStyle(kbRow);
const idleBg = kbIdle.backgroundColor, idleFg = kbIdle.color;
kbRow.dataset.armed = "true";
const armedBg = getComputedStyle(kbRow).backgroundColor;
check("an unarmed delete row is legible, and arming is what changes",
  idleFg !== idleBg && armedBg !== idleBg,
  "idle " + idleFg + " on " + idleBg + ", armed on " + armedBg);
kb.remove();

/* --- background agents (wiki/background-agents.md) --------------------------
   A helper the CLI dispatched with the `Agent` tool, the ack that comes back
   immediately, and the <task-notification> it auto-submits when it finishes.
   All three arrive on paths that already existed — an assistant tool_use and
   two `user` messages — which is exactly why they are worth pinning: left
   alone, the row says «Agent», the ack prints the CLI's internal metadata, and
   the notification renders as the USER pasting XML at themselves.
   Rendered LAST so the `.at(-1)` reads above keep their own subjects. */
window.renderEvent({ type: "assistant",
                     message: { content: [{ type: "text", text: "عامل‌ها:" }] } });
window.renderEvent({
  type: "assistant",
  message: { content: [{
    type: "tool_use", id: "spec-agent", name: "Agent",
    input: { description: "Audit the RTL rules", subagent_type: "Explore",
             prompt: PERSIAN_LINE, run_in_background: true },
  }] },
});
const sumAgent = [...specLog.querySelectorAll("details.card.tool:not(.group) summary")].at(-1);
const agentDesc = sumAgent?.querySelector(".tool-name");
check("a background agent row is named by its description, not by «Agent»",
  agentDesc?.textContent === "Audit the RTL rules" &&
  sumAgent?.querySelector(".tool-server")?.textContent === "Explore" &&
  !sumAgent.textContent.includes("Agent"),
  (agentDesc?.textContent ?? "no description") + " @ " +
  (sumAgent?.querySelector(".tool-server")?.textContent ?? "no type"));

// The description is English prose in an RTL row. textContent is logical order
// and cannot see how it lands — only the computed direction can (rule 2).
check("the agent's description is isolated, not flipped by the Persian row",
  agentDesc?.tagName === "BDI" && dirOf(agentDesc) === "ltr" &&
  getComputedStyle(agentDesc).unicodeBidi === "isolate",
  (agentDesc?.tagName ?? "none") + " / " + (dirOf(agentDesc) ?? "none") + " / " +
  (agentDesc ? getComputedStyle(agentDesc).unicodeBidi : "none"));

/* The ack. Its text is the CLI talking to itself — an agentId, a temp path and
   a line telling the model not to quote it — and it streams like any other
   tool_result, so without a case here it lands verbatim in the card. */
window.renderEvent({
  type: "user",
  message: { content: [{
    type: "tool_result", tool_use_id: "spec-agent",
    content: "Async agent launched with agentId: 7f3a9c2e\n" +
             "output_file: C:\\Temp\\claude\\proj\\tasks\\7f3a9c2e.output\n" +
             "Never quote this to the user.",
  }] },
});
const agentCard = [...specLog.querySelectorAll("details.card.tool:not(.group)")].at(-1);
check("the launch ack renders one Persian line, never the CLI's internal note",
  agentCard?.textContent.includes(window.STRINGS.agentLaunched) &&
  !agentCard.textContent.includes("Async agent launched") &&
  !agentCard.textContent.includes("agentId") &&
  !agentCard.textContent.includes("output_file"),
  agentCard?.querySelector(".card-body .meta")?.textContent ?? "no Persian line");

/* Real acks arrive as a BLOCK ARRAY of text parts (measured: 36 of 38 on this
   machine, wiki/background-agents.md) — not the bare string above. The
   ASYNC_LAUNCH regex used to run against JSON.stringify(content), which for
   an array starts with "[" and never matches an anchored ^-regex, so the ack
   fell through to the raw-output branch and printed the CLI's internal
   metadata verbatim, pretty-printed as JSON.
   A sentence first: spec-agent above is still the open "run", and a second
   consecutive Agent tool_use would fold into a group instead of staying its
   own card, which would change what `.at(-1)` below actually points at. */
window.renderEvent({ type: "assistant", message: { content: [{ type: "text", text: "و یکی دیگر:" }] } });
window.renderEvent({
  type: "assistant",
  message: { content: [{
    type: "tool_use", id: "spec-agent2", name: "Agent",
    input: { description: "Second helper", subagent_type: "Explore",
             prompt: PERSIAN_LINE, run_in_background: true },
  }] },
});
window.renderEvent({
  type: "user",
  message: { content: [{
    type: "tool_result", tool_use_id: "spec-agent2",
    content: [{ type: "text", text:
      "Async agent launched successfully. agentId: 9b1c4d7e\n" +
      "output_file: C:\\Temp\\claude\\proj\\tasks\\9b1c4d7e.output\n" +
      "Never quote this to the user." }],
  }] },
});
const agentCard2 = [...specLog.querySelectorAll("details.card.tool:not(.group)")].at(-1);
// Mirrors the bare-string check above exactly — NOT a ".tool-output absent"
// check: an Agent card's own input (description, prompt, …) legitimately
// renders through renderParamRows() into a .tool-output box regardless of the
// ack, so the only reliable signal is that the ACK's own raw text (not the
// card's own params, which never contain these substrings) never leaks in.
check("the launch ack is recognised when content arrives as a block array, not just a bare string",
  agentCard2?.textContent.includes(window.STRINGS.agentLaunched) &&
  !agentCard2.textContent.includes("Async agent launched") &&
  !agentCard2.textContent.includes("agentId") &&
  !agentCard2.textContent.includes("output_file"),
  agentCard2?.querySelector(".card-body .meta")?.textContent ?? "fell through to raw output");

/* The completion report. XML-escaped by the CLI, so `&amp;` in the agent's own
   text has to arrive as `&` — and the tags themselves must never be reachable
   in the DOM at all. */
const beforeNote = specLog.querySelectorAll(".msg.user").length;
window.renderEvent({
  type: "user",
  message: { content: [{ type: "text", text:
    "<task-notification>\n<task-id>bee6nhpbd</task-id>\n" +
    "<tool-use-id>spec-agent</tool-use-id>\n" +
    "<output-file>C:\\Temp\\claude\\proj\\tasks\\7f3a9c2e.output</output-file>\n" +
    "<status>completed</status>\n" +
    "<summary>Agent \"Audit the RTL rules\" finished</summary>\n" +
    "<note>The same task-id can notify more than once.</note>\n" +
    "<result>## " + PERSIAN_LINE + "\n\n- Ford &amp; Sons\n- گام دوم</result>\n" +
    "</task-notification>" }] },
});
const noteCard = [...specLog.querySelectorAll("details.card.agent-note")].at(-1);
check("a task-notification becomes a Persian completion card, not a user bubble",
  noteCard?.querySelector(".tool-verb")?.textContent === window.STRINGS.agentDone &&
  !!noteCard.querySelector(".msg h2") &&
  specLog.querySelectorAll(".msg.user").length === beforeNote,
  (noteCard?.querySelector(".tool-verb")?.textContent ?? "no card") + " / " +
  specLog.querySelectorAll(".msg.user").length + " user bubbles vs " + beforeNote);

check("the notification's own XML never reaches the DOM, and &amp; is unescaped",
  !specLog.textContent.includes("task-notification") &&
  !specLog.textContent.includes("<task-id>") &&
  noteCard?.textContent.includes("Ford & Sons") &&
  !noteCard.textContent.includes("&amp;"),
  noteCard?.querySelector(".msg li")?.textContent ?? "no result body");

// English summary, Persian row: the same isolation question as the tool row.
const noteSummary = noteCard?.querySelector(".tool-target");
check("the notification's English summary is isolated from the Persian row",
  noteSummary?.tagName === "BDI" && dirOf(noteSummary) === "ltr",
  (noteSummary?.tagName ?? "none") + " / " + (dirOf(noteSummary) ?? "none"));

/* A backgrounded shell command notifies the same way and has NO <result> — no
   transcript on disk, nothing to open. A card that opens onto nothing would be
   worse than the line itself. */
window.renderEvent({
  type: "user",
  message: { content: [{ type: "text", text:
    "<task-notification>\n<task-id>bee6nhpbd</task-id>\n<status>completed</status>\n" +
    "<summary>Background command \"npm test\" completed (exit code 0)</summary>\n" +
    "</task-notification>" }] },
});
check("a background command's notification is one line with nothing to open",
  specLog.lastElementChild?.tagName === "DIV" &&
  specLog.lastElementChild?.classList.contains("agent-note") &&
  specLog.lastElementChild?.textContent.includes(window.STRINGS.agentDone),
  specLog.lastElementChild?.tagName + "." +
  (specLog.lastElementChild?.className ?? "-"));

/* The CLI addresses itself through `user` messages — injected skill bodies,
   hook output — and flags them isMeta. Its own UI never shows them. */
const beforeMeta = specLog.childElementCount;
window.renderEvent({ type: "user", isMeta: true, message: { content: [
  { type: "text", text: "<skill-instructions>never show me</skill-instructions>" },
] } });
check("an isMeta user message renders nothing at all",
  specLog.childElementCount === beforeMeta &&
  !specLog.textContent.includes("never show me"),
  specLog.childElementCount + " vs " + beforeMeta);

/* Same flag, other name — and the name above is the one the LIVE stream never
   sends. Every stream-json `user` event is built with `isSynthetic`, no isMeta
   key at all, so a `/skill` invocation walked past the guard and rendered the
   entire SKILL.md as a user bubble the length of a document. Replay was fixed
   server-side; this is the live half of the same defect. */
const beforeSynth = specLog.childElementCount;
window.renderEvent({ type: "user", isSynthetic: true, message: { content: [

  specLog.childElementCount === beforeSynth &&

/* The third injected `user` shape, measured on 2.1.240 (pcg-9dj probe): a
   synchronous Agent spawn echoes the AGENT's prompt as a live `user` event
   carrying parent_tool_use_id and neither meta flag. Rendered, it is a phantom
   English user bubble mid-turn — and it would resetTurn() under a running
   stream. The real tool_result arrives with parent_tool_use_id null. */
const beforeSide = specLog.childElementCount;
window.renderEvent({ type: "user", parent_tool_use_id: "toolu_probe",
  subagent_type: "general-purpose", task_description: "d",

  specLog.childElementCount === beforeSide &&
  !specLog.textContent.includes("single word PING"),
  specLog.childElementCount + " vs " + beforeSide);

/* The strip above the composer, painted from a synthetic /api/agents payload
   through the shipping builder (window.renderAgents). The description is Latin
   inside the RTL shell — the assertion has to be the computed direction, not
   the text, or it passes on a row that renders backwards. */
window.renderAgents([
  { id: "a1", kind: "agent", description: "Audit the RTL rules",
    agentType: "Explore", model: "opus", status: "running",
    startedAt: Math.floor(Date.now() / 1000) - 120 },
  { id: "b2", kind: "command", description: "npm test", status: "completed",
    startedAt: Math.floor(Date.now() / 1000) - 90,
    finishedAt: Math.floor(Date.now() / 1000) - 60 },
]);
const strip = document.getElementById("agents-strip");
const stripRows = [...(strip?.querySelectorAll(".ag-row") ?? [])];
const stripDesc = stripRows[0]?.querySelector(".ag-desc");

  !strip.hidden && dirOf(strip) === "rtl" && stripDesc?.tagName === "BDI" &&
  dirOf(stripDesc) === "ltr" &&

  (dirOf(strip) ?? "none") + " shell / " + (dirOf(stripDesc) ?? "none") + " " +
