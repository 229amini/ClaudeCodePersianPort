/* The strip is the LIVE line above the composer, so it carries what is still
   running and nothing else — a finished helper (here the completed `b2`
   command) has already reported back in the transcript, and leaving its row up
   there only accumulated dead rows for the life of the session. The registry
   itself keeps every entry; the drawer is the history view. */
check("an agent row opens, and a finished helper is not in the strip at all",
  stripRows.length === 1 && stripRows[0].tagName === "BUTTON" &&
  !strip.querySelector('[data-agent-id="b2"]') &&
  stripRows[0].querySelector(".ag-type")?.textContent === "Explore",
  stripRows.map(r => r.dataset.agentId + ":" + r.tagName).join(",") || "no rows");

// Prose, so Persian digits (rule 5) — both the elapsed time and the count.
check("the strip counts the waiting agents in Persian digits",
  strip.querySelector(".ag-wait")?.textContent ===
    window.STRINGS.agentsWaiting.replace("{n}", "۱") &&
  stripRows[0].querySelector(".ag-time")?.textContent === "۲ دقیقه",
  (strip.querySelector(".ag-wait")?.textContent ?? "no wait line") + " / " +
  (stripRows[0]?.querySelector(".ag-time")?.textContent ?? "no elapsed"));

/* paint() rebuilds every `.ag-row` from scratch on each poll (replaceChildren
   ()), which used to throw focus to <body> mid-tab — a keyboard/screen-reader
   user could not use the strip for as long as any agent ran. Focus the first
   row, repaint with the SAME agent id, and check focus followed the row
   instead of falling back to document.body. Not a BiDi property — this bug
   has nothing to do with direction — so the assertion is DOM identity
   (dataset.agentId), the analogous "not textContent" check for a focus bug. */
strip.querySelector('.ag-row[data-agent-id="a1"]')?.focus();
window.renderAgents([
  { id: "a1", kind: "agent", description: "Audit the RTL rules",
    agentType: "Explore", model: "opus", status: "running",
    startedAt: Math.floor(Date.now() / 1000) - 125 },
  { id: "b2", kind: "command", description: "npm test", status: "completed",
    startedAt: Math.floor(Date.now() / 1000) - 90,
    finishedAt: Math.floor(Date.now() / 1000) - 60 },
]);
check("a repaint preserves focus on the equivalent row instead of dropping it to body",
  document.activeElement?.dataset.agentId === "a1" &&
  document.activeElement !== document.body,
  document.activeElement === document.body ? "focus lost to body"
    : (document.activeElement?.dataset.agentId ?? "no agent id"));

/* The drawer. It is a [popover], and the trap that costs a session is `display`:
   an author rule at any specificity beats the UA rule that hides a CLOSED
   popover, so it may only be set on :popover-open. A drawer that is always
   visible and a drawer that never opens look identical in a screenshot. */
stripRows[0].click();
const dPanel = document.getElementById("agent-drawer");
check("clicking an agent opens a drawer that is laid out only while open",
  !!dPanel && dPanel.matches(":popover-open") &&
  getComputedStyle(dPanel).display === "flex" &&
  dirOf(dPanel.querySelector(".ag-head .ag-desc")) === "ltr" &&
  !!dPanel.querySelector(".ag-log"),
  dPanel ? getComputedStyle(dPanel).display + " / " +
           (dirOf(dPanel.querySelector(".ag-head .ag-desc")) ?? "none")
         : "no drawer");

/* The popover UA sheet sets `height: fit-content`, and an absolutely positioned
   box whose height is not `auto` ignores its own `inset-block-end` — so the
   drawer grew downward off the bottom of the window, `.ag-log`'s `flex: 1` had
   no bounded height to fill, and a long agent transcript could not be scrolled
   to at all. Only a drawer holding MORE than fits can see it, hence the filler:
   an empty drawer is inside the window either way. */
const dLog = dPanel.querySelector(".ag-log");
const filler = document.createElement("div");
filler.style.blockSize = "400vh";
dLog.append(filler);
check("the drawer stays inside the window and scrolls its own transcript",
  dPanel.getBoundingClientRect().bottom <= innerHeight + 1 &&
  dLog.scrollHeight > dLog.clientHeight + 1,
  Math.round(dPanel.getBoundingClientRect().bottom) + "px bottom / " + innerHeight +
  "px window, log " + dLog.scrollHeight + " in " + dLog.clientHeight);
filler.remove();

// Closing has to take the panel AND its poll with it — one exit, so nothing
// keeps reading a transcript for a drawer nobody is looking at.
dPanel.querySelector(".ag-close").click();
check("closing the drawer removes it entirely",
  !document.getElementById("agent-drawer"),
  document.getElementById("agent-drawer") ? "still there" : "gone");

/* Drawer toggle race: click agent A, then agent B before A's own `toggle`
   fires. openDrawer() closes the previous drawer with hidePopover(), which
   runs SYNCHRONOUSLY, but a popover's `toggle` event is only QUEUED (the same
   trap the close button above already sidesteps) — so A's toggle listener is
   still live when B's drawer is built and open. The listener used to call the
   module-global closeDrawer() unconditionally, so A's late event tore down
   B's drawer instead of its own. Fired synthetically rather than waited for:
   the harness's script is synchronous and the queued task would not have run
   before the DOM dump, but the listener itself does not know or care whether
   the event was queued or dispatched by hand. */
window.renderAgents([
  { id: "ra1", kind: "agent", description: "Race helper A", agentType: "Explore",
    status: "running", startedAt: Math.floor(Date.now() / 1000) - 30 },
  { id: "ra2", kind: "agent", description: "Race helper B", agentType: "Explore",
    status: "running", startedAt: Math.floor(Date.now() / 1000) - 20 },
]);
const raceRows = [...strip.querySelectorAll(".ag-row")];
raceRows[0].click();                          // opens A
const panelA = document.getElementById("agent-drawer");
raceRows[1].click();                          // opens B — openDrawer() closes A first
const panelB = document.getElementById("agent-drawer");
const lateToggle = new Event("toggle");
lateToggle.newState = "closed";
panelA.dispatchEvent(lateToggle);             // A's queued toggle, fired late
check("a late toggle from a closed drawer does not tear down the one that replaced it",
  document.getElementById("agent-drawer") === panelB &&
  panelB.matches(":popover-open"),
  document.getElementById("agent-drawer")
    ? "drawer B present" : "drawer GONE — closed the wrong one");
panelB.querySelector(".ag-close").click();    // leave no drawer open behind

/* R3: a finished agent used to vanish from the UI entirely once its running
   row left the strip — a row's own click was the only way into the drawer,
   and paint() never painted anything but status==="running". A muted history
   toggle keeps the running-only strip (deliberate — finished-rows-shown-
   forever was the original complaint) but makes a completed agent reachable
   again. */
window.renderAgents([
  { id: "c1", kind: "agent", description: "Refactor the exporter",
    agentType: "Explore", status: "completed",
    startedAt: Math.floor(Date.now() / 1000) - 300,
    finishedAt: Math.floor(Date.now() / 1000) - 120 },
]);
check("a finished-only registry shows the toggle, not a row",
  !strip.hidden && !!strip.querySelector(".ag-history") &&
  strip.querySelectorAll(".ag-row").length === 0,
  (strip.hidden ? "hidden" : "visible") + " / " +
  (strip.querySelector(".ag-history") ? "toggle" : "no toggle") + " / " +
  strip.querySelectorAll(".ag-row").length + " rows");

strip.querySelector(".ag-history").click();
check("clicking the toggle paints the finished agent as a completed row",
  !!strip.querySelector('button.ag-row[data-status="completed"]'),
  strip.querySelector(".ag-row")?.dataset.status ?? "no row");

window.renderAgents([]);
check("an empty registry still hides the strip entirely",
  strip.hidden,
  strip.hidden ? "hidden" : "visible");

/* The seam the drawer replays through — one renderer, two sources (plan §B-4),
   so it points the SHIPPING renderer at another element instead of forking one.
   Two ways it fails silently and neither is visible in the drawer itself: the
   agent's tool cards landing in the main transcript's state.toolCards (a
   tool_use id is only unique within one transcript), and `log` never being
   handed back — after which every message in the conversation renders into a
   detached element. Only rendering AFTER the swap can catch the second. */
const scoped = document.createElement("div");
const scope = newRenderScope();
withRenderTarget(scoped, scope, () => {
  window.renderEvent({ type: "assistant", message: { content: [{
    type: "tool_use", id: "spec-scoped", name: "Read",
    input: { file_path: "C:\\x\\scoped.txt" },
  }] } });
});
const afterSeam = specLog.childElementCount;
window.renderEvent({ type: "assistant",
                     message: { content: [{ type: "text", text: "بعد از عامل" }] } });
check("a scoped replay renders elsewhere, keeps its own cards, and hands back",
  !!scoped.querySelector("details.card.tool") &&
  scope.toolCards.has("spec-scoped") && !state.toolCards.has("spec-scoped") &&
  specLog.childElementCount === afterSeam + 1,
  (scoped.childElementCount + " scoped, " +
   (state.toolCards.has("spec-scoped") ? "LEAKED" : "isolated") + ", log " +
   specLog.childElementCount + " vs " + (afterSeam + 1)));

/* --- concurrent conversations ------------------------------------------------

   The window runs up to six `claude` processes and shows one of them. Every SSE
   event carries the tab it belongs to, and an event for a tab the user is NOT
   looking at has to do two things: render into that tab's own detached node,
   and touch no window chrome at all. Both fail silently — the first looks like
   a stray message in the wrong conversation, the second like a statusline that
   is simply "wrong" — and neither is visible in a screenshot of one tab.

   There is no active tab on this page, so #log is the harness's own DOM: it is
   saved here and handed back at the end. */
const specKeep = [...specLog.childNodes];
const bgTab = "spec-tab-bg";
const otherTab = "spec-tab-other";
const logBefore = specLog.childElementCount;
const topbarBefore = document.getElementById("topbar-name").textContent;
const modelBefore = document.getElementById("model-chip-name").textContent;
const sessionBefore = state.status.sessionId;

routeEvent({ tab: bgTab, type: "assistant",
             message: { content: [{ type: "text", text: "پیام گفتگوی پس‌زمینه" }] } });
const bgEntry = tabs.get(bgTab);
check("a background tab renders into its own buffer, never into the visible view",
  specLog.childElementCount === logBefore &&
  bgEntry?.node.querySelectorAll(".msg.assistant").length === 1,
  specLog.childElementCount + " vs " + logBefore + " in #log, " +
  (bgEntry ? bgEntry.node.childElementCount : "no") + " buffered");

routeEvent({ tab: bgTab, type: "system", subtype: "init",
             session_id: "spec-bg-session", cwd: "C:\\spec\\background",
             model: "claude-spec-bg", permissionMode: "default" });
check("a background system/init leaves every piece of window chrome alone",
  document.getElementById("topbar-name").textContent === topbarBefore &&
  document.getElementById("model-chip-name").textContent === modelBefore &&
  state.status.sessionId === sessionBefore &&
  bgEntry?.scope.status.sessionId === "spec-bg-session" &&
  bgEntry?.scope.chrome.model === "claude-spec-bg",
  "topbar «" + document.getElementById("topbar-name").textContent + "» model «" +
  document.getElementById("model-chip-name").textContent + "» parked " +
  (bgEntry?.scope.chrome.model ?? "nothing"));

routeEvent({ tab: otherTab, type: "assistant",
             message: { content: [{ type: "text", text: "پیام گفتگوی دیگر" }] } });

applySwitch(bgTab);
check("switching to a tab applies the chrome it collected while it was hidden",
  document.getElementById("topbar-name").textContent === "background" &&
  document.getElementById("model-chip-name").textContent === "claude-spec-bg" &&
  state.status.sessionId === "spec-bg-session",
  "topbar «" + document.getElementById("topbar-name").textContent + "» model «" +
  document.getElementById("model-chip-name").textContent + "»");
const bgOnScreen = specLog.textContent.includes("پیام گفتگوی پس‌زمینه");

applySwitch(otherTab);
check("a switch swaps the whole view: one transcript on screen, the other parked",
  bgOnScreen &&
  specLog.textContent.includes("پیام گفتگوی دیگر") &&
  !specLog.textContent.includes("پیام گفتگوی پس‌زمینه") &&
  (tabs.get(bgTab)?.node.textContent ?? "").includes("پیام گفتگوی پس‌زمینه"),
  (bgOnScreen ? "" : "first switch showed nothing; ") +
  "#log now holds " + specLog.childElementCount + " nodes");

/* --- the tab lifecycle -------------------------------------------------------

   Everything below is one invariant the single-session design used to give for
   free — ONE transcript in #log, and always exactly one live conversation —
   being broken by a second one arriving late. Each case is driven through the
   seam the real caller uses, because none of them is visible in the DOM of the
   tab you are looking at. */

/* A replayed transcript is fetched, and the tab it was fetched FOR can be
   parked or gone by the time it comes back. Rendered into whatever is on
   screen then, it hands the visible conversation another one's history — and
   the next park copies it into that tab permanently. chrome.js's replaySession
   is internal, so this drives the seam it now routes through. */
const logNodesBefore = specLog.childElementCount;
renderInTab(bgTab, (node) => {
  node.replaceChildren();   // a replay starts from an empty view, like the real one
  window.renderEvent({ type: "assistant",
    message: { content: [{ type: "text", text: "تاریخچه‌ی بازپخش" }] } });
});
check("a replay aimed at a parked tab fills its buffer and never touches the visible view",
  specLog.childElementCount === logNodesBefore &&
  !specLog.textContent.includes("تاریخچه‌ی بازپخش") &&
  (tabs.get(bgTab)?.node.textContent ?? "").includes("تاریخچه‌ی بازپخش"),
  specLog.childElementCount + " vs " + logNodesBefore + " in #log, buffered «" +
  (tabs.get(bgTab)?.node.textContent ?? "nothing") + "»");

let orphanRendered = false;
renderInTab("spec-tab-gone", () => { orphanRendered = true; });
check("a transcript whose tab closed mid-fetch is dropped, not rendered somewhere else",
  !orphanRendered && specLog.childElementCount === logNodesBefore,
  orphanRendered ? "rendered anyway" : "dropped");

/* One dialog serves every conversation, so a request from a tab that has been
   closed would sit in the queue and open on the NEXT answer — asking the user
   to consent to a tool call in a conversation that no longer exists, into a
   pipe nobody is reading. The queued one is exactly the half that a
   permission_resolved cannot reach: the server never resolves what it dropped. */
const permTab = "spec-tab-perm";
const permAsk = (tab, id) => routeEvent({
  tab, type: "wrapper", subtype: "permission_request", request_id: id,
  tool_name: "Bash", tool_use_id: id + "-tool", tool_input: { command: "echo " + id },
});
permAsk(otherTab, "spec-perm-keep");    // the visible conversation: stays
permAsk(permTab, "spec-perm-drop");     // queued behind it, from another tab
const permDialogOpen = permDialog.open;
routeEvent({ tab: permTab, type: "wrapper", subtype: "closed" });
// Answering the visible request drains the queue: if the dead tab's request
// were still in it, the dialog would re-open here rather than close.
routeEvent({ tab: otherTab, type: "wrapper", subtype: "permission_resolved",
             request_id: "spec-perm-keep", tool_use_id: "spec-perm-keep-tool",
             decision: "deny" });
check("closing a conversation takes the permission it was still waiting on with it",
  permDialogOpen && !permDialog.open && !tabs.has(permTab),
  (permDialogOpen ? "" : "dialog never opened; ") +
  (permDialog.open ? "dialog re-opened on the dead tab's request" : "queue clear"));

/* A /api/tabs GET served mid-spawn answers WITHOUT the tab being spawned. When
   that snapshot was allowed to prune, it deleted the entry holding that
   conversation's buffered init_info — the slash commands and the model
   catalogue, replayed only on a fresh SSE subscribe, so nothing would ever ask
   for them again. The server's own `closed` event is the only authority. */
const snapTab = "spec-tab-snap";
routeEvent({ tab: snapTab, type: "wrapper", subtype: "init_info",
             info: { commands: [{ name: "spec-only", description: "فقط برای تست" }] } });
applyTabs({ active: otherTab,
            tabs: [{ tab: otherTab, session_id: null, cwd: "C:\\spec", busy: false }] });
const snapSurvived = tabs.has(snapTab)
  && !!tabs.get(snapTab)?.scope.chrome.slash?.length;
routeEvent({ tab: snapTab, type: "wrapper", subtype: "closed" });
check("a stale snapshot cannot delete a conversation, and the server's own close event can",
  snapSurvived && !tabs.has(snapTab),
  (snapSurvived ? "survived the snapshot with its slash list" : "PRUNED mid-spawn") +
  ", after closed: " + (tabs.has(snapTab) ? "still there" : "gone"));

/* The pulse's 500 ms interval lives in the SCOPE, not in the node: emptying a
   closed tab's node leaves the timer painting an element nobody will ever see
   again, for the life of the window, and cycling the six-tab cap accumulates
   them. Only the ACTIVE tab's pulse is reachable through resetTurn(). */
const pulseTab = "spec-tab-pulse";
routeEvent({ tab: pulseTab, type: "wrapper", subtype: "user_echo", text: "سلام" });
const pulseEntry = tabs.get(pulseTab);
const pulseWasLive = !!pulseEntry?.scope.pulse;
routeEvent({ tab: pulseTab, type: "wrapper", subtype: "closed" });
check("closing a background tab mid-turn stops its pulse instead of leaking the timer",
  pulseWasLive && pulseEntry.scope.pulse === null && !tabs.has(pulseTab),
  (pulseWasLive ? "" : "no pulse to begin with; ") +
  "scope.pulse " + (pulseEntry?.scope.pulse === null ? "cleared" : "STILL RUNNING"));

specLog.replaceChildren(...specKeep);   // the harness takes its own DOM back

/* The sidebar's «نشست‌های باز» group, driven exactly as app.js drives it. Two
   things are worth gating: the Windows path on every row (plan §B-10 item 2 —
   chrome is where paths regress, and no message-shaped case reaches it), and
   the ✕, which is the only way out of a conversation. */
const bridgeCalls = [];
setTabBridge({ switchTo: (t) => bridgeCalls.push("switch:" + t),
               close: (t) => bridgeCalls.push("close:" + t) });
setOpenTabs([
  { tab: "t1", session_id: null, cwd: "C:\\Users\\Lion\\Projects\\one", busy: true },
  { tab: "t2", session_id: "sess-2", cwd: "D:\\projects\\two", busy: false },
  { tab: "t3", session_id: "sess-3", cwd: "D:\\projects\\پروژه‌ی من", busy: false },
], "t2");

const tabRows = [...document.querySelectorAll("#open-tabs .tab-row")];
const firstProj = tabRows[0]?.querySelector("bdi.tab-proj");
check("the open-conversations group draws one row per live session, names isolated",
  tabRows.length === 3 &&
  tabRows[0].dataset.busy === "true" && tabRows[1].dataset.current === "true" &&
  tabRows[0].querySelector(".tab-name").textContent === window.STRINGS.tabFresh &&
  !!firstProj && firstProj.textContent === "one" &&
  getComputedStyle(firstProj).direction === "ltr",
  tabRows.length + " rows, project «" + (firstProj?.textContent ?? "none") + "» -> " +
  (firstProj ? getComputedStyle(firstProj).direction : "none"));

/* The same element, with the name this audience actually types. It is a DISPLAY
   NAME, not a path — renameable, and Persian more often than not — so pathEl's
   forced LTR misordered it and seated it against the left edge of an RTL row.
   Only the computed direction can see that; the textContent is identical either
   way. The Latin row above is the other half: dir="auto" has to leave that one
   LTR inside the RTL shell, or the fix is just an inherited direction. */
const faProj = tabRows[2]?.querySelector("bdi.tab-proj");
check("a Persian project name in a tab row reads right-to-left, not forced LTR",
  !!faProj && faProj.textContent === "پروژه‌ی من" &&
  !faProj.classList.contains("path") &&
  faProj.getAttribute("dir") === "auto" &&
  getComputedStyle(faProj).direction === "rtl" &&
  getComputedStyle(faProj).unicodeBidi === "isolate" &&
  faProj.title === "D:\\projects\\پروژه‌ی من",
  faProj
    ? faProj.className + " / " + getComputedStyle(faProj).direction + " / " +
      getComputedStyle(faProj).unicodeBidi
    : "no project chip");

tabRows[0].querySelector(".tab-open").click();
tabRows[1].querySelector(".tab-close").click();
check("a row switches to its conversation and the ✕ closes that one, not the open one",
  bridgeCalls.join(" ") === "switch:t1 close:t2",
  bridgeCalls.join(" ") || "nothing was called");

/* --- the live stream: one paint per frame, and the direction it paints with --
   The transcript follows the stream by writing log.scrollTop, and every one of
   those writes has to land instantly. With `scroll-behavior: smooth` the write
   reads back as the OLD offset (the animation has not run yet), atBottom()
   answers "no" on the next event and the view stops following the stream for
   good — measured at 2/40 appends followed, ending 1616 px adrift. Computed
   style is the only thing that can see it. */
check("#log never animates a programmatic scroll",
  getComputedStyle(specLog).scrollBehavior === "auto",
  getComputedStyle(specLog).scrollBehavior);

const streamDelta = (text) => window.renderEvent(
  { type: "stream_event", event: { type: "content_block_delta", delta: { text } } });

/* Where the first character of a bubble's text actually LANDED. A streamed
   bubble is plain text under `.msg { unicode-bidi: plaintext }`, which decides
   the base direction from the first strong character and ignores `dir` — so
   `getComputedStyle(el).direction` reads "rtl" from the attribute while the
   line is laid out left-to-right. Same trap as the "+2 −1" defect: the property
   that is wrong is not the one being asked about. Geometry is not fooled — in
   an RTL line the opening Latin run sits at the RIGHT end of the box. */
function headX(el) {
  const range = document.createRange();
  range.setStart(el.firstChild, 0);
  range.setEnd(el.firstChild, 1);
  const r = range.getBoundingClientRect();
  return r.left + r.width / 2;
}
const midX = (el) => el.getBoundingClientRect().left + el.getBoundingClientRect().width / 2;

// Majority Persian, opening with a Latin technical term — the shape this
// product's prose actually has, and the one first-strong gets wrong.
const STREAM_FA = ["Object Cache ", "با Redis کانفیگ شده — ",
                   "ولی یک ایراد در تنظیمات دارد که باید درست شود."];
for (const chunk of STREAM_FA) streamDelta(chunk);
const streamBubble = state.streamBubble;
// Nothing may have been painted yet: the deltas ran in one synchronous loop and
// the write is coalesced onto the next frame. This is the O(n²) guard — a
// renderer that writes textContent per delta shows the text here.
const paintedEarly = streamBubble?.textContent ?? "(no bubble)";
flushFrame();

check("a streaming bubble paints once per frame, right-to-left when its text is Persian",
  !!streamBubble && paintedEarly === "" &&
  streamBubble.textContent === STREAM_FA.join("") &&
  streamBubble.getAttribute("dir") === "rtl" &&
  getComputedStyle(streamBubble).unicodeBidi === "isolate" &&
  headX(streamBubble) > midX(streamBubble),
  streamBubble
    ? "before the frame: «" + paintedEarly.slice(0, 20) + "», after: " +
      streamBubble.textContent.length + " chars, dir=" +
      streamBubble.getAttribute("dir") + "/" +
      getComputedStyle(streamBubble).unicodeBidi +
      ", first char at " + Math.round(headX(streamBubble)) +
      " of " + Math.round(midX(streamBubble))
    : "no stream bubble");

/* The load-bearing half of the coalescing: a delta queued and NOT yet painted
   when the message closes. The queued write is the raw stream text, so landing
   it after the markdown swap replaces a finished answer with its own source. */
streamDelta(" و یک تکه دیگر.");
window.renderEvent({ type: "assistant", message: { content: [{ type: "text",
  text: "## نتیجه\n\nمتن فارسی با `Redis` و توضیح کوتاه." }] } });
flushFrame();
const settledP = streamBubble?.querySelector("p");
check("the markdown that settles a streamed answer is not wiped by a queued paint",
  !!settledP && !!streamBubble.querySelector("h2") &&
  !streamBubble.classList.contains("streaming") &&
  !streamBubble.textContent.includes("Object Cache") &&
  getComputedStyle(settledP).direction === "rtl",
  settledP
    ? streamBubble.children.length + " rendered children, class «" +
      streamBubble.className + "», p is " + getComputedStyle(settledP).direction
    : "no rendered markdown left: " + (streamBubble?.textContent.slice(0, 30) ?? "gone"));

/* The other side of the measurement, and the assertion that stops anyone
   "simplifying" the streaming rule into a hardcoded direction: an English
   answer keeps dir="auto" and the browser still resolves it left-to-right. */
for (const chunk of ["Object Cache is configured ", "with Redis, but one setting is wrong."]) {
  streamDelta(chunk);
}
const enBubble = state.streamBubble;
flushFrame();
check("an English stream still resolves left-to-right",
  !!enBubble && enBubble !== streamBubble &&
  enBubble.getAttribute("dir") === "auto" &&
  getComputedStyle(enBubble).direction === "ltr" &&
  headX(enBubble) < midX(enBubble),
  enBubble
    ? "dir=" + enBubble.getAttribute("dir") + " -> " +
      getComputedStyle(enBubble).direction + ", first char at " +
      Math.round(headX(enBubble)) + " of " + Math.round(midX(enBubble))
    : "no stream bubble");

/* What all of the above is FOR: the transcript follows a reader who is sitting
   at the bottom and leaves alone one who has scrolled up. The stick moved into
   the frame callback along with the paint, so it is now possible to coalesce
   the write and lose the follow — and that failure is invisible until an answer
   is long enough to scroll. `scrollable` is not decoration: an unscrollable box
   satisfies both halves trivially, which is a check that can never fail. */
const scrollable = specLog.scrollHeight > specLog.clientHeight + 80;
specLog.scrollTop = specLog.scrollHeight;
streamDelta(" A further sentence, long enough to push the box down another line or two.");
flushFrame();
// EXACTLY at the bottom, not merely inside atBottom()'s own 80 px window: one
// delta grows the bubble by about a line, so a "close enough" assertion passes
// with the stick deleted and guards nothing (measured — it did).
const pinned = Math.abs(specLog.scrollHeight - specLog.clientHeight - specLog.scrollTop) <= 1;
specLog.scrollTop = 0;
streamDelta(" And one more after that, which the reader above is not asking to see.");
flushFrame();
check("a delta follows a reader pinned to the bottom and leaves one who scrolled up alone",
  scrollable && pinned && specLog.scrollTop === 0,
  (scrollable ? "" : "NOT SCROLLABLE — the check proves nothing; ") +
  "pinned: " + (pinned ? "followed" : "fell behind") +
  ", scrolled up: at " + Math.round(specLog.scrollTop));

window.requestAnimationFrame = realRaf;

/* --- the stop button that stopped nothing (bead pcg-kk9) --------------------

   «در حال تراشیدن…» ran indefinitely with the stop button up while the CLI was
   idle. The window derives "working" from the commands it has sent and not yet
   seen closed (render.js state.outstanding), so anything that eats a terminal
   state strands it at working forever — and stop then interrupts a CLI with
   nothing to interrupt, producing no aborted result to unstick it either. The
   server is the only side that can know; it says so with wrapper/idle_sync.

   Scoped, so the settled line here is this case's own and not one of the
   transcript entries the pulse checks above left behind. */
const stuck = document.createElement("div");
const stuckScope = newRenderScope();
withRenderTarget(stuck, stuckScope, () => {
  window.renderEvent({ type: "wrapper", subtype: "user_echo",
                       text: "سلام", uuid: "cmd-stuck" });
});
check("a turn in flight reports working, with one live status line",
  document.body.classList.contains("busy") &&
  stuck.querySelectorAll(".pulse.live").length === 1,
  (document.body.classList.contains("busy") ? "busy" : "NOT busy") + " / " +
  stuck.querySelectorAll(".pulse.live").length + " live");

withRenderTarget(stuck, stuckScope, () => {
  window.renderEvent({ type: "wrapper", subtype: "idle_sync" });
});
check("idle_sync ends a turn that produced no result: idle window, settled line",
  !document.body.classList.contains("busy") && stuckScope.outstanding.size === 0 &&
  stuck.querySelectorAll(".pulse.live").length === 0 &&
  stuck.querySelectorAll(".pulse").length === 1,
  (document.body.classList.contains("busy") ? "STILL busy" : "idle") +
  " / ledger " + stuckScope.outstanding.size + " / " +
  stuck.querySelectorAll(".pulse.live").length + " live of " +
  stuck.querySelectorAll(".pulse").length);

/* Both late arrivals are no-ops by construction — a second idle_sync, and the
   aborted result the CLI may still send after all. Either one printing a second
   closing line would turn the fix into its own defect. */
withRenderTarget(stuck, stuckScope, () => {
  window.renderEvent({ type: "wrapper", subtype: "idle_sync" });
  window.renderEvent({ type: "result", subtype: "error_during_execution",
                       terminal_reason: "aborted_streaming", usage: {} });
});
check("a late idle_sync and a late aborted result add no second closing line",
  stuck.querySelectorAll(".pulse").length === 1 &&
  stuck.querySelectorAll(".pulse.live").length === 0 &&
  !document.body.classList.contains("busy") &&
  stuck.textContent.includes(window.STRINGS.stopped),
  stuck.querySelectorAll(".pulse").length + " pulse rows / " +
  (stuck.textContent.includes(window.STRINGS.stopped) ? "«متوقف شد» present"
                                                      : "no stop note"));

/* --- the idle hint during agent-driven work (bead pcg-63y) ------------------
   The turn that dispatched the helpers ENDED, so `busy` is false and the
   conversation looks abandoned — «مدتی از این گفتگو گذشته» arrived in the
   middle of a session the user could watch working, and read as an error.
   agents.js publishes the fact as a body class (the same signal it already
   reads in the other direction, `body.busy`); composer.js obeys it. */
window.renderEvent({ type: "wrapper", subtype: "usage", context: 12 });  // clear the notice
// The activity clock is stamped on setBusy's busy→idle edge and the earlier
// idle case consumed it. Re-armed through the shipping path, in its own scope.
const idleScope = newRenderScope();
withRenderTarget(document.createElement("div"), idleScope, () => {
  window.renderEvent({ type: "wrapper", subtype: "user_echo",
                       text: "کار", uuid: "cmd-idle" });
  window.renderEvent({ type: "result", subtype: "success", usage: {}, result: "ok" });
  doneCmd("cmd-idle");
});
window.renderAgents([
  { id: "idle-1", kind: "agent", description: "Still working", agentType: "Explore",
    status: "running", startedAt: Math.floor(Date.now() / 1000) - 60 },
]);
window.checkIdle(Date.now() + 61 * 60 * 1000);
check("the idle hint stays away while a background agent is still running",
  ctx.hidden && document.body.classList.contains("agents-running"),
  (ctx.hidden ? "quiet" : "SHOWED: «" +
    (ctx.querySelector(".ctx-title")?.textContent ?? "?") + "»") + " / " +
  (document.body.classList.contains("agents-running") ? "flag set" : "NO flag"));

// A suppression, not a mute switch: once the helpers are done the hint is free
// again. Without this half, deleting checkIdle entirely would pass the check above.
window.renderAgents([]);
window.checkIdle(Date.now() + 61 * 60 * 1000);
check("with nothing running any more the hint is free to fire again",
  !ctx.hidden &&
  ctx.querySelector(".ctx-title")?.textContent === window.STRINGS.idleTitle,
  ctx.hidden ? "still hidden"
             : (ctx.querySelector(".ctx-title")?.textContent ?? "no title"));
ctx.hidden = true;

/* --- Shift+Tab cycles the approval posture (bead pcg-hta) -------------------
   Parity with the TUI, and it has to run through the pill's own path: the chip
   moves only when the SERVER echoes the change back, because an optimistic
   permission control that looks engaged and is not is the exact defect class
   this project exists to avoid (wiki/approval-postures.md). So the assertions
   are what went on the wire, that focus stayed in the box, and — the load-
   bearing one — that pressing it twice does NOT advance twice. */
window.renderEvent({ type: "wrapper", subtype: "posture", posture: "ask",
                     auto_count: 0 });
const realFetch = window.fetch;
const posted = [];
window.fetch = (url, options) => {
  posted.push({ url: String(url), body: options?.body });
  return Promise.resolve(new Response('{"ok":true}', { status: 200 }));
};
const pressShiftTab = () => {
  const ev = new KeyboardEvent("keydown",
    { key: "Tab", shiftKey: true, cancelable: true, bubbles: true });
  input.dispatchEvent(ev);
  return ev;
};
const firstPress = pressShiftTab();
check("Shift+Tab asks the server for the next posture and keeps the caret in the box",
  firstPress.defaultPrevented && posted.length === 1 &&
  posted[0].url.startsWith("/api/posture") &&
  JSON.parse(posted[0].body ?? "{}").posture === "acceptEdits",
  (firstPress.defaultPrevented ? "" : "focus LEFT the box; ") +
  posted.map(p => p.url.split("?")[0] + " " + p.body).join(" | ") || "nothing sent");

pressShiftTab();
check("a second press with no echo asks for the same one — the pill never moves itself",
  posted.length === 2 && JSON.parse(posted[1].body ?? "{}").posture === "acceptEdits",
  posted[1]?.body ?? "nothing sent");

// The engine's own echo is what advances it — and the list wraps, so the last
// posture leads back to «طرح‌ریزی» rather than dead-ending.
window.renderEvent({ type: "wrapper", subtype: "posture", posture: "autoApprove",
                     auto_count: 0 });
pressShiftTab();
window.fetch = realFetch;
check("the server's echo is what advances it, and the cycle wraps round",
  posted.length === 3 && JSON.parse(posted[2].body ?? "{}").posture === "plan",
  posted[2]?.body ?? "nothing sent");

/* --- Esc stops the running turn (bead pcg-b33) -----------------------------
   Parity with the TUI, and the whole risk is the OTHER direction: Esc is
   already how you dismiss a modal, a popover, the slash list and the chip
   menu, so an interrupt bound to it must stay out of the way of every one of
   those. The assertions are therefore two negatives and one positive, and the
   negatives are the load-bearing ones — a stray interrupt kills a turn the
   user only meant to un-open a menu for. */
const escLog = document.createElement("div");
const escScope = newRenderScope();
const escFetch = window.fetch;
const escPosts = [];
window.fetch = (url, options) => {
  escPosts.push(String(url).split("?")[0]);
  return Promise.resolve(new Response('{"ok":true}', { status: 200 }));
};
const pressEsc = () => {
  const ev = new KeyboardEvent("keydown",
    { key: "Escape", cancelable: true, bubbles: true });
  document.dispatchEvent(ev);
  return ev;
};

// Nothing running: Esc is not ours, and the box keeps what was typed.
input.value = "متنی که نباید پاک شود";
const idleEsc = pressEsc();
check("with no turn running Esc does nothing and the composer keeps its text",
  !idleEsc.defaultPrevented && escPosts.length === 0 &&
  input.value === "متنی که نباید پاک شود",
  (escPosts.join(" | ") || "nothing sent") + " / «" + input.value + "»");
input.value = "";

// Busy, but something dismissible is open — the popover owns the key. Built
// here rather than borrowed from the app so the check is about the guard.
withRenderTarget(escLog, escScope, () => {
  window.renderEvent({ type: "wrapper", subtype: "user_echo",
                       text: "کار طولانی", uuid: "cmd-esc" });
});
const escPop = document.createElement("div");
escPop.popover = "auto";
document.body.append(escPop);
escPop.showPopover();
const popEsc = pressEsc();
check("Esc closes an open popover instead of killing the turn behind it",
  document.body.classList.contains("busy") &&
  !popEsc.defaultPrevented && escPosts.length === 0,
  (document.body.classList.contains("busy") ? "" : "NOT busy; ") +
  (escPosts.join(" | ") || "nothing sent"));
escPop.hidePopover();
escPop.remove();

const stopEsc = pressEsc();
check("with a turn running and nothing open, Esc interrupts it",
  stopEsc.defaultPrevented && escPosts.length === 1 &&
  escPosts[0] === "/api/interrupt",
  escPosts.join(" | ") || "nothing sent");

window.fetch = escFetch;
withRenderTarget(escLog, escScope, () => {
  window.renderEvent({ type: "result", subtype: "success", usage: {}, result: "ok" });
  doneCmd("cmd-esc");
});

/* --- a polling loop is one pair, not sixteen rows (bead pcg-2an) ------------
   A model waiting on something wrote «منتظر می‌مانم.» and read the same file
   eight times, and the transcript showed sixteen rows. Three or more
   CONSECUTIVE identical pairs fold into one, counted — and the comparison is on
   the SOURCE markdown plus the row's own summary, never on rendered DOM, which
   carries a different tool_use id in every cycle. */
const loop = document.createElement("div");
const loopScope = newRenderScope();
/* A REAL cycle, not a sketch: a sentence, a call, and the call's own OUTPUT.
   The first version of this fixture sent no tool_result and made one call per
   cycle, and that blindness is exactly why the gate sailed over a fold that
   detached cards state.toolCards was still routing results into — the terminal
   poll's output landed in nothing, and no assertion here could see it. */
const pollCycle = (id, file = "b7j0iksrd.output", out = "still waiting") => {
  window.renderEvent({ type: "assistant",
    message: { content: [{ type: "text", text: "منتظر می‌مانم." }] } });
  window.renderEvent({ type: "assistant", message: { content: [{
    type: "tool_use", id: "poll-" + id, name: "Read",
    input: { file_path: "C:\\Temp\\" + file } }] } });
  window.renderEvent({ type: "user", message: { content: [{
    type: "tool_result", tool_use_id: "poll-" + id, content: out }] } });
};
withRenderTarget(loop, loopScope, () => { pollCycle(1); pollCycle(2); });
check("two identical cycles are a retry, not a loop — both stay on screen",
  loop.querySelectorAll(":scope > .msg.assistant").length === 2 &&
  loop.querySelectorAll(":scope > details.card.tool").length === 2 &&
  !loop.querySelector(".tool-repeat"),
  loop.querySelectorAll(":scope > .msg.assistant").length + " sentences / " +
  loop.querySelectorAll(":scope > details.card.tool").length + " rows / " +
  (loop.querySelector(".tool-repeat") ? "folded too early" : "not folded"));

withRenderTarget(loop, loopScope, () => { pollCycle(3); pollCycle(4); });
const loopBadge = loop.querySelector(".tool-repeat");
check("four identical cycles collapse into one pair, counted in Persian digits",
  loop.querySelectorAll(":scope > .msg.assistant").length === 1 &&
  loop.querySelectorAll(":scope > details.card.tool").length === 1 &&
  loopBadge?.textContent === "۴ بار",
  loop.querySelectorAll(":scope > .msg.assistant").length + " sentences / " +
  loop.querySelectorAll(":scope > details.card.tool").length + " rows / «" +
  (loopBadge?.textContent ?? "no count") + "»");

// The other side of the measurement: one changed parameter is a different
// cycle, and four of those are four rows. Nothing here may fold.
const varied = document.createElement("div");
withRenderTarget(varied, newRenderScope(), () => {
  for (let i = 1; i <= 4; i++) pollCycle("v" + i, "run-" + i + ".output");
});
check("cycles that differ by one parameter are never folded together",
  varied.querySelectorAll(":scope > details.card.tool").length === 4 &&
  varied.querySelectorAll(":scope > .msg.assistant").length === 4 &&
  !varied.querySelector(".tool-repeat"),
  varied.querySelectorAll(":scope > details.card.tool").length + " rows / " +
  (varied.querySelector(".tool-repeat") ? "FOLDED" : "kept apart"));

/* WHAT THE FOLDED ROW OPENS TO. The pair that survives is the NEWEST one, and
   its own tool_result has not arrived yet at fold time — so this is the check
   that the fold did not detach the card that result is routed to. Keeping the
   FIRST pair instead left the row showing cycle 1's output while the loop's
   terminal output — the poll that finally said something — existed nowhere. */
withRenderTarget(loop, loopScope, () => {
  pollCycle(5, "b7j0iksrd.output", "DONE: the file finally appeared");
});
// The card BODY, not the first `.tool-output` in it: renderToolDetail paints
// the call's own parameters into a box of the same class, so a narrower
// selector reads the file path back and proves nothing about the result.
const foldedBody = loop.querySelector("details.card.tool > .card-body");
const foldedOut = foldedBody?.textContent ?? "";
check("the folded row opens to the LAST cycle's output, not the first",
  loop.querySelectorAll(":scope > details.card.tool").length === 1 &&
  foldedOut.includes("DONE:") && !loop.textContent.includes("still waiting") &&
  loop.querySelector(".tool-repeat")?.textContent === "۵ بار",
  (foldedOut.includes("DONE:") ? "last output kept" : "row body: " + foldedOut) + " / «" +
  (loop.querySelector(".tool-repeat")?.textContent ?? "no count") + "»");

/* The fold removes cards, and toolHome() keeps a reference to the run's FIRST
   card so it can replaceWith() a group around it later. Pointed at a node the
   fold detached, that call is a silent no-op: the group never enters the log,
   and every card of that run renders into a detached subtree — invisible, with
   no error anywhere. So: fold, then make a second consecutive call, which is
   the thing that builds a group. */
withRenderTarget(loop, loopScope, () => {
  for (const cmd of ["git status", "git log"]) {
    window.renderEvent({ type: "assistant", message: { content: [{
      type: "tool_use", id: "after-" + cmd, name: "Bash",
      input: { command: cmd } }] } });
  }
});
const afterFold = [...loop.querySelectorAll("details.card.tool[data-tool=\"Bash\"]")];
check("tool calls after a fold stay in the transcript, not in a detached group",
  afterFold.length === 2 && afterFold.every(c => loop.contains(c)) &&
  !!loop.querySelector("details.card.group"),
  afterFold.length + " Bash cards, " +
  afterFold.filter(c => loop.contains(c)).length + " reachable, group " +
  (loop.querySelector("details.card.group") ? "present" : "MISSING"));

/* INTERLEAVED THINKING does not fold, and the point of this case is that it
   fails SAFE. A thinking card is runnable, so it wraps the cycle's tool card
   into a `.group` and the pair is no longer a top-level [sentence][card] — the
   adjacency test misses, `state.repeat` is dropped and NOTHING is removed. Four
   thinking cycles are therefore four cycles on screen, exactly as they were
   before any of this existed. Recorded as a limitation in render.js with the
   upgrade path (detect the pair on the event stream, where a thinking delta is
   distinguishable from a tool call); this is the assertion that it stays a
   limitation rather than becoming a corruption. */
const thinky = document.createElement("div");
withRenderTarget(thinky, newRenderScope(), () => {
  for (let i = 1; i <= 4; i++) {
    window.renderEvent({ type: "assistant",
      message: { content: [{ type: "text", text: "منتظر می‌مانم." }] } });
    window.renderEvent({ type: "stream_event", event: { type: "content_block_delta",
      delta: { thinking: "Checking again." } } });
    window.renderEvent({ type: "assistant", message: { content: [{
      type: "tool_use", id: "think-" + i, name: "Read",
      input: { file_path: "C:\\Temp\\poll.output" } }] } });
  }
});
check("a loop with interleaved thinking does not fold, and loses nothing",
  thinky.querySelectorAll(":scope > .msg.assistant").length === 4 &&
  thinky.querySelectorAll("details.card.tool[data-tool='Read']").length === 4 &&
  !thinky.querySelector(".tool-repeat"),
  thinky.querySelectorAll(":scope > .msg.assistant").length + " sentences / " +
  thinky.querySelectorAll("details.card.tool[data-tool='Read']").length +
  " calls kept / " +
  (thinky.querySelector(".tool-repeat") ? "FOLDED" : "not folded"));

/* The count is one more chip on the transcript's most repeated element, so it
   inherits that element's one-line guard. Measured in the real log — a detached
   node reports every box as 0×0 and the check would prove nothing. */
specLog.append(...loop.childNodes);
const loopSummary = [...specLog.querySelectorAll("details.card.tool > summary")]
  .find(s => s.querySelector(".tool-repeat"));
check("a folded loop's row is still one line, count included",
  (loopSummary?.getBoundingClientRect().height ?? 99) < 40 &&
  loopSummary?.scrollWidth <= loopSummary?.clientWidth + 1,
  Math.round(loopSummary?.getBoundingClientRect().height ?? 0) + "px, " +
  loopSummary?.scrollWidth + " vs " + loopSummary?.clientWidth);

/* --- the direction classifier counts LETTERS, and knows more than Latin -----
   (review F5.) autoDir() promotes a block to dir="rtl" when it measures at
   least half strong-RTL, and its two character classes were both wrong in ways
   no existing case could see. The RTL class swept in whole blocks of bidi-WEAK
   characters — Arabic-Indic digits and Arabic punctuation — contradicting its
   own comment, and the LTR class knew Latin and nothing else, so every other
   strong-L script lost every vote it should have had. Both assertions are the
   COMPUTED direction as well as the attribute: `dir="auto"` left in place is
   the browser deciding, which is the whole point of promote-only. */
const dirCase = document.createElement("div");
specLog.append(dirCase);

dirCase.append(...window.renderMarkdown("Total: ۱۲۳۴۵۶۷۸۹۰۱۲").childNodes);
const digitP = dirCase.querySelector("p");
check("Persian digits vote for nobody: a Latin line full of them stays LTR",
  digitP?.getAttribute("dir") === "auto" && dirOf(digitP) === "ltr",
  (digitP?.getAttribute("dir") ?? "none") + " -> " + (dirOf(digitP) ?? "none"));

// Strong L that is not Latin. One Persian word inside it used to win 1-0.
dirCase.append(...window.renderMarkdown(
  "\u0421\u0442\u0440\u0443\u043a\u0442\u0443\u0440\u0430 \u043f\u0440\u043e\u0435\u043a\u0442\u0430 \u0438 \u0435\u0433\u043e \u0444\u0430\u0439\u043b\u044b: پروژه").childNodes);
const cyrP = dirCase.querySelectorAll("p")[1];
check("a Cyrillic sentence quoting one Persian word is not pinned RTL",
  cyrP?.getAttribute("dir") === "auto" && dirOf(cyrP) === "ltr",
  (cyrP?.getAttribute("dir") ?? "none") + " -> " + (dirOf(cyrP) ?? "none"));

// The half this must NOT have broken: a genuinely Persian block, opening with a
// Latin technical term, is still promoted. That is what autoDir exists for.
dirCase.append(...window.renderMarkdown(
  "Redis این یک جمله فارسی است.").childNodes);
const faP = dirCase.querySelectorAll("p")[2];
check("a majority-Persian block opening with a Latin term is still promoted",
  faP?.getAttribute("dir") === "rtl" && dirOf(faP) === "rtl",
  (faP?.getAttribute("dir") ?? "none") + " -> " + (dirOf(faP) ?? "none"));

/* --- the question's prose has ONE implementation (review F9) ----------------
   AskUserQuestion is rendered twice, and the two copies drifted: the dialog's
   legend was moved onto the inline pipeline and the transcript's header was
   left as raw textContent, so the same header read scrambled in one of the two
   places and nothing said so. Both now go through render.js questionProse().
   The `ask:` cases above cover the dialog; this covers the transcript copy. */
window.renderEvent({ type: "assistant", message: { content: [{
  type: "tool_use", id: "spec-q-body", name: "AskUserQuestion",
  input: { questions: [{
    header: "`/price-photo/` انتخاب مسیر",
    question: "`/price-photo/` کدام مسیر؟",
    options: [{ label: "Sparkling water", description: "این یک جمله فارسی است." }],
  }] } }] } });
// `.at(-1)`: an earlier case already put a question card in this log, and the
// first one is not the one just rendered.
const qBlock = [...specLog.querySelectorAll(".q-block")].at(-1);
const qHead = qBlock?.querySelector(".q-header");
const qText = qBlock?.querySelector(".q-text");
check("the transcript's question header gets the inline pipeline, not textContent",
  !!qHead?.querySelector("code") && !qHead.textContent.includes("`") &&
  ["auto", "rtl"].includes(qHead.getAttribute("dir")),
  (qHead?.textContent ?? "no header") + " -> dir=" +
  (qHead?.getAttribute("dir") ?? "none") +
  (qHead?.querySelector("code") ? " with <code>" : " NO <code>"));

// Measured direction, not the attribute: the header opens with a Latin code
// span, which is exactly the shape first-strong alone gets wrong.
check("the transcript's header and question resolve right-to-left",
  dirOf(qHead) === "rtl" && dirOf(qText) === "rtl",
  (dirOf(qHead) ?? "none") + " / " + (dirOf(qText) ?? "none"));

/* --- a torn-down stream is settled, never left mid-flight (review F10) ------
   resetTurn() nulled state.streamBubble without endStreamPaint(), so every
   teardown that is not an assistant close — a stopped turn, idle_sync, a dead
   CLI — left the bubble wearing `.streaming` forever. That class is what lets
   the measured `dir` beat `.msg { unicode-bidi: plaintext }`, so the bubble was
   stuck on a verdict taken mid-sentence, and its queued paint stayed live for
   one more frame. The rAF queue is driven by hand here for the same reason as
   the streaming cases above. */
const tornQueue = [];
window.requestAnimationFrame = (fn) => tornQueue.push(fn);
const torn = document.createElement("div");
specLog.append(torn);
const tornScope = newRenderScope();
withRenderTarget(torn, tornScope, () => {
  window.renderEvent({ type: "wrapper", subtype: "user_echo", text: "کدام مسیر؟" });
  window.renderEvent({ type: "stream_event", event: { type: "content_block_delta",
                                                      delta: { text: "Half a sen" } } });
});
for (const fn of tornQueue.splice(0)) fn(performance.now());
const tornBubble = torn.querySelector(".msg.assistant");
const wasStreaming = !!tornBubble?.classList.contains("streaming");
withRenderTarget(torn, tornScope, () => {
  window.renderEvent({ type: "wrapper", subtype: "idle_sync" });
});
for (const fn of tornQueue.splice(0)) fn(performance.now());
window.requestAnimationFrame = realRaf;
check("a stream torn down without an assistant close is settled, not left streaming",
  wasStreaming && !tornBubble.classList.contains("streaming") &&
  getComputedStyle(tornBubble).unicodeBidi === "plaintext" &&
  tornScope.streamBubble === null,
  (wasStreaming ? "" : "never streamed; ") +
  "class \u00ab" + tornBubble?.className + "\u00bb / " +
  (tornBubble ? getComputedStyle(tornBubble).unicodeBidi : "none"));

/* --- Shift+Tab is not a stuck key, and not a stolen one (review F7) -------- */
window.fetch = (url, options) => {
  posted.push({ url: String(url), body: options?.body });
  return Promise.resolve(new Response('{"ok":true}', { status: 200 }));
};
const before = posted.length;
const heldDown = new KeyboardEvent("keydown",
  { key: "Tab", shiftKey: true, repeat: true, cancelable: true, bubbles: true });
input.dispatchEvent(heldDown);
check("auto-repeat sends nothing: one press is one posture change",
  posted.length === before && heldDown.defaultPrevented,
  (posted.length - before) + " requests from a held key");

/* Bound on the DOCUMENT, the key was stolen from every other surface in the
   shell: the sidebar's inline rename field, the agents drawer, any menu. The
   back-off named only `dialog[open]` and the slash popup, which exempts none of
   those — so typing a session name and pressing Shift+Tab silently stepped the
   approval posture instead of moving focus. A posture IS confirmed here
   («خودکار», echoed above), which is what stops this case from passing for the
   wrong reason. */
const stray = document.createElement("input");
document.body.append(stray);
const strayPress = new KeyboardEvent("keydown",
  { key: "Tab", shiftKey: true, cancelable: true, bubbles: true });
stray.dispatchEvent(strayPress);
stray.remove();
check("Shift+Tab inside a text field belongs to the field, not to the posture pill",
  posted.length === before && !strayPress.defaultPrevented,
  (strayPress.defaultPrevented ? "swallowed" : "passed through") + ", " +
  (posted.length - before) + " requests");

// No posture confirmed for this conversation yet: the key is not ours, so it
// must fall through to the browser's own reverse focus navigation rather than
// being swallowed into a no-op.
restoreControls(null);
const unowned = pressShiftTab();
window.fetch = realFetch;
check("with no posture to cycle, Shift+Tab is left to the browser",
  posted.length === before && !unowned.defaultPrevented,
  (unowned.defaultPrevented ? "swallowed" : "passed through") + ", " +
  (posted.length - before) + " requests");

/* --- the closing line survives a reload, and the recap ---------------------

   A refresh replays the hub's ENTIRE event history, so every finished turn is
   rendered a second time: startPulse() runs again for a turn that ended
   minutes ago. Two things used to be re-invented at that moment — a
   Math.random() verb, so the same turn wore a different word after every
   reload, and a wall clock that measures the replay instead of the turn, so a
   two-minute answer settled at «۰ ثانیه». The verb is derived from the prompt
   and the clock takes the CLI's own duration_ms as its floor. Rendered into
   the live document (not a detached node) because the direction assertions
   below read COMPUTED style. */
function replayOneTurn() {
  const box = document.createElement("div");
  specLog.append(box);
  withRenderTarget(box, newRenderScope(), () => {
    window.renderEvent({ type: "wrapper", subtype: "user_echo",
                        text: "کارها را جمع‌بندی کن", uuid: "cmd-replay" });
    window.renderEvent({ type: "result", subtype: "success", usage: {},
                        duration_ms: 125_000, result: "ok" });
    doneCmd("cmd-replay");
  });
  return box.querySelector(".pulse")?.textContent.replace(/\s+/g, " ").trim() ?? "";
}
const replayA = replayOneTurn();
const replayB = replayOneTurn();
check("a replayed turn settles to the same closing line, timed by the CLI's own clock",
  !!replayA && replayA === replayB && replayA.includes("۲ دقیقه و ۵ ثانیه"),
  "«" + replayA + "» vs «" + replayB + "»");

/* The recap itself: the CLI's «※ recap: …» as a transcript entry. It is model
   prose, so it goes through the markdown path like every other answer — a
   textContent read is blind to both halves of that (rule 1 and the backticks),
   which is why this asserts the computed direction and the code span. */
const recapBox = document.createElement("div");
specLog.append(recapBox);
withRenderTarget(recapBox, newRenderScope(), () => {
  window.renderEvent({ type: "wrapper", subtype: "recap",
    text: "هدف: تمام کردن `setup.ps1`. بعدی: اجرای تست." });
});
const recapP = recapBox.querySelector(".recap .recap-body p");
check("the session recap renders as Persian prose, not as a raw string",
  !!recapP && getComputedStyle(recapP).direction === "rtl" &&
  recapBox.querySelector(".recap code")?.textContent === "setup.ps1" &&
  !recapBox.textContent.includes("`"),
  recapP ? getComputedStyle(recapP).direction + " / «" +
           recapBox.textContent.replace(/\s+/g, " ").trim() + "»" : "no recap line");

/* Away is a real five minutes of no input, not "the answer took a while": the
   recap costs an API call and is worth one only when nobody was reading. The
   negative half is conditioned on the window actually being on screen —
   `document.hidden` is away by itself, and a headless engine may report
   either. */
dispatchEvent(new KeyboardEvent("keydown", { key: "a" }));
/* And the harness itself must never buy one. This page drives the shipping
   renderer against a REAL server with no token, so a recap fired from here
   would reach the CLI and spend a turn on every run of the free gate. Every
   result event above has already gone through the same code path. */
window.fetch = (url, options) => {
  posted.push({ url: String(url), body: options?.body });
  return Promise.resolve(new Response('{"ok":true}', { status: 200 }));
};
const beforeRecap = posted.length;
withRenderTarget(document.createElement("div"), newRenderScope(), () => {
  window.renderEvent({ type: "wrapper", subtype: "user_echo",
                       text: "سلام", uuid: "cmd-recap" });
  window.renderEvent({ type: "result", subtype: "success", usage: {}, result: "ok" });
  doneCmd("cmd-recap");   // the batch ends HERE — where the recap is asked for
});
window.fetch = realFetch;
check("the untokened spec harness never buys a recap",
  posted.slice(beforeRecap).every(r => !r.url.includes("/api/recap")),
  posted.slice(beforeRecap).map(r => r.url).join(", ") || "no requests");

const now = Date.now();
check("the recap waits five minutes of silence before it costs anything",
  isAway(now + 6 * 60_000) && (document.hidden || !isAway(now + 60_000)),
  "1 min → " + isAway(now + 60_000) + ", 6 min → " + isAway(now + 6 * 60_000) +
  (document.hidden ? " (window reported hidden)" : ""));

/* --- the queue is shown as a queue, not as a delivered message --------------

   A send that arrives while the CLI is still answering is NOT delivered: it
   waits in the CLI's own command queue, where it may be folded into the
   running turn, merged with the rest of the queue, or dropped outright
   (wiki/cli-stream-json-findings.md "The message queue"). Rendered as an
   ordinary user bubble it looked delivered, which is exactly why a message
   that never ran was indistinguishable from one that did.

   Everything below is driven by the EVENT ORDER alone, because that is all a
   fresh window has: it rebuilds this strip out of the SSE backlog, so a
   message still genuinely queued at refresh time belongs back in it. */
input.value = "";
const qLog = document.createElement("div");
const qScope = newRenderScope();
const qStrip = () => document.getElementById("queue-strip");
const qRows = () => [...(qStrip()?.querySelectorAll(".queued-row") ?? [])];
/* Every read below is null-tolerant on purpose: with the feature removed the
   strip does not exist at all, and a throw here empties the WHOLE verdict —
   which is a failure that says nothing about which case broke. */
const qHidden = () => qStrip()?.hidden !== false;
const qRowText = (uuid) =>
  qStrip()?.querySelector('[data-uuid="' + uuid + '"] .queued-text');
const qBubbles = () => [...qLog.querySelectorAll(".msg.user")]
  .map((b) => b.textContent.replace(/\s+/g, " ").trim());
const qSend = (uuid, text) => window.renderEvent(
  { type: "wrapper", subtype: "user_echo", text, uuid });
const qLife = (uuid, state) => window.renderEvent(
  { type: "command_lifecycle", command_uuid: uuid, state });

// The turn itself, then a second message typed while it is still answering.
withRenderTarget(qLog, qScope, () => {
  qSend("q-a", "اولین پیام");
  qSend("q-b", "این یکی باید در صف بماند");
});
check("a send mid-turn waits in the queue strip instead of claiming it was delivered",
  qBubbles().length === 1 && qRows().length === 1 && !qHidden() &&
  qRows()[0]?.textContent.includes("این یکی باید در صف بماند") &&
  !qLog.textContent.includes("این یکی باید در صف بماند"),
  qBubbles().length + " bubbles / " + qRows().length + " queued rows" +
  (qStrip()?.hidden ? " (strip HIDDEN)" : ""));

// The CLI starting it is what earns it a place in the transcript — which is
// also where the CLI itself puts it, so live and replay converge. The count
// BEFORE is half the assertion: a bubble that was already there was never
// waiting on the CLI for anything.
const beforeStart = qBubbles().length;
withRenderTarget(qLog, qScope, () => qLife("q-b", "started"));
check("the CLI starting a queued message is what moves it into the transcript",
  qRows().length === 0 && qHidden() && beforeStart === 1 &&
  qBubbles().length === 2 && qBubbles()[1].includes("این یکی باید در صف بماند"),
  beforeStart + " bubbles before `started`, " + qRows().length +
  " rows left after / bubbles: " + qBubbles().join(" | "));

/* Re-delivery must change nothing. The transport dedupes an SSE reconnect by
   `Last-Event-ID` (parity-chrome.md), but the strip is keyed by uuid so that
   the same events arriving twice produce the same one row and the same one
   bubble — never a second of either. */
const beforeDupes = qBubbles().length;
withRenderTarget(qLog, qScope, () => {
  qSend("q-c", "پیام تکراری");
  qSend("q-c", "پیام تکراری");
});
const dupeRows = qRows().length;
withRenderTarget(qLog, qScope, () => {
  qLife("q-c", "started");
  qLife("q-c", "started");
});
check("the same queued message delivered twice is still one row and one bubble",
  dupeRows === 1 && qRows().length === 0 &&
  qBubbles().length === beforeDupes + 1,
  dupeRows + " rows for two echoes, " +
  (qBubbles().length - beforeDupes) + " bubbles for two starts");

/* Cancelled, discarded or refused: that message will never run, and the text
   the person typed may not vanish with it. */
input.value = "";
withRenderTarget(qLog, qScope, () => {
  qSend("q-d", "این پیام را پس بگیر");
  qLife("q-d", "cancelled");
});
check("a cancelled queued message is not lost: the row goes, the text comes back to the box",
  qRows().length === 0 && input.value.includes("این پیام را پس بگیر") &&
  !qLog.textContent.includes("این پیام را پس بگیر"),
  qRows().length + " rows / box «" + input.value + "»");

/* ...and it is APPENDED, never assigned: a half-typed message outranks one from
   a minute ago. Delivered twice it must still appear once — and the second
   delivery is a RELOAD replaying the SSE backlog, which is how the server sends
   it: marked. That mark is what dedupes now. It used to be
   `input.value.includes(text)` in restoreDraft(), which dropped a returned
   message whenever it happened to be a substring of the current draft — a way
   of losing text, dressed as a guard. */
input.value = "چیزی که دارم تایپ می‌کنم";
withRenderTarget(qLog, qScope, () => {
  qSend("q-e", "و این هم پس بیاید");
  qLife("q-e", "discarded");
  qSend("q-e", "و این هم پس بیاید");
  window.renderEvent({ type: "command_lifecycle", command_uuid: "q-e",
                       state: "discarded", replayed: true });
});
check("a returned message is appended below what is being typed, once",
  input.value.startsWith("چیزی که دارم تایپ می‌کنم") &&
  input.value.split("و این هم پس بیاید").length === 2,
  "«" + input.value.replace(/\n/g, " \\n ") + "»");
input.value = "";

/* Rule 1 in the strip: the row's text is USER content, so it decides its own
   direction by the same counting rule every block in the transcript uses. The
   «در صف» chip beside it is chrome and stays with the RTL shell. A textContent
   read is blind to all of this — only the computed style sees it. */
withRenderTarget(qLog, qScope, () => {
  qSend("q-fa", "این پیام فارسی است و باید راست‌چین خوانده شود");
  qSend("q-en", "please run the test suite again when you are done");
});
check("a queued row reads in its own direction: Persian right-to-left, Latin left-to-right",
  dirOf(qRowText("q-fa")) === "rtl" && dirOf(qRowText("q-en")) === "ltr" &&
  dirOf(qStrip()?.querySelector(".queued-tag")) === "rtl",
  "fa " + dirOf(qRowText("q-fa")) + " / en " + dirOf(qRowText("q-en")) +
  " / tag " + dirOf(qStrip()?.querySelector(".queued-tag")));

/* The ✕ does not decide anything itself: only the CLI knows whether a message
   is still in its queue, and it answers `{"cancelled": false}` for one it has
   already taken out to run. So the row asks, by uuid, at one endpoint. */
const qFetch = window.fetch;
const qPosts = [];
window.fetch = (url, options) => {
  qPosts.push({ url: String(url).split("?")[0], body: options?.body });
  return Promise.resolve(new Response('{"cancelled":true}', { status: 200 }));
};
qStrip()?.querySelector('[data-uuid="q-fa"] .queued-x')?.click();
window.fetch = qFetch;
check("the row's ✕ asks the CLI to drop that one message, by uuid",
  qPosts.length === 1 && qPosts[0].url === "/api/queue/cancel" &&
  JSON.parse(qPosts[0].body ?? "{}").uuid === "q-fa",
  qPosts.map((p) => p.url + " " + p.body).join(" | ") || "nothing sent");

/* The wrapper saying this conversation has nothing in flight empties the strip
   — and hands the text back, which is the opposite of what this case used to
   assert. The old rule ("idle_sync means the wrapper can no longer account for
   these") lost the text outright on the no-receipt stop path: an older CLI, or
   a receipt that never came, and the row died in the strip with the typed
   message nowhere. It is safe because a row still SITTING in the strip has
   emitted no lifecycle event at all — anything the CLI actually reached was
   promoted out of it by its own `started` long before five seconds of total
   silence could elapse. */
input.value = "";
const stranded = qRowText("q-en")?.textContent ?? "";
withRenderTarget(qLog, qScope, () => window.renderEvent(
  { type: "wrapper", subtype: "idle_sync" }));
check("idle_sync empties the strip and gives the stranded message back",
  qRows().length === 0 && qHidden() && qScope.queued.size === 0 &&
  !!stranded && input.value.includes(stranded),
  qRows().length + " rows / stranded «" + stranded + "» / box «" +
  input.value + "»");

/* A STOP does not settle a message the CLI kept. The interrupt receipt lists
   `still_queued[]` on purpose (server.py _settle_interrupt) — those commands
   will run and report for themselves — so a window that emptied its whole
   ledger on the aborted result settled the pulse and hid the stop button while
   a message it had sent was still on its way to an answer. That is the exact
   defect the uuid ledger exists to close, recreated client-side. */
input.value = "";
const stopLog = document.createElement("div");
const stopScope = newRenderScope();
withRenderTarget(stopLog, stopScope, () => {
  qSend("s-run", "این یکی در حال اجراست");
  qSend("s-keep", "و این یکی در صف ماند");
  window.renderEvent({ type: "result", subtype: "error_during_execution",
                       terminal_reason: "aborted_streaming", usage: {} });
});
check("a stop settles the running turn but not the message still in the queue",
  stopScope.outstanding.has("s-keep") && !stopScope.outstanding.has("s-run") &&
  qRows().length === 1 && stopLog.querySelectorAll(".pulse.live").length === 1 &&
  document.body.classList.contains("busy"),
  [...stopScope.outstanding].join(",") + " outstanding / " + qRows().length +
  " rows / " + stopLog.querySelectorAll(".pulse.live").length + " live / " +
  (document.body.classList.contains("busy") ? "busy" : "IDLE mid-queue"));

// ...and the CLI's own answer for it — the synthetic `cancelled` the receipt
// publishes — is what finally settles the window and returns the text.
withRenderTarget(stopLog, stopScope, () => qLife("s-keep", "cancelled"));
check("the receipt's own cancelled settles the line and hands the text back",
  stopScope.outstanding.size === 0 && qRows().length === 0 &&
  stopLog.querySelectorAll(".pulse.live").length === 0 &&
  input.value.includes("و این یکی در صف ماند"),
  stopScope.outstanding.size + " outstanding / box «" + input.value + "»");

// A stop with NOTHING queued still settles on the spot: nothing else reaches
// this window instantly on a stop, and waiting for the wrapper's five-second
// silence would leave the line breathing after every press.
input.value = "";
const soloStop = document.createElement("div");
const soloScope = newRenderScope();
withRenderTarget(soloStop, soloScope, () => {
  qSend("s-solo", "یک نوبت ساده");
  window.renderEvent({ type: "result", subtype: "error_during_execution",
                       terminal_reason: "aborted_streaming", usage: {} });
});
check("a stop with nothing queued is still instant",
  soloScope.outstanding.size === 0 &&
  soloStop.querySelectorAll(".pulse.live").length === 0 &&
  !document.body.classList.contains("busy"),
  soloScope.outstanding.size + " outstanding / " +
  soloStop.querySelectorAll(".pulse.live").length + " live / " +
  (document.body.classList.contains("busy") ? "STILL busy" : "idle"));

/* A fresh window is handed the WHOLE SSE backlog, so a cancellation from an
   hour ago is re-delivered on every reload. The server marks that replay
   (Hub.subscribe), and the give-back obeys the mark: the row still drops —
   replay must converge on the same end state a live window reached — but the
   text is not handed back a second time, or the composer grows a zombie draft
   per refresh. */
input.value = "";
const rLog = document.createElement("div");
const rScope = newRenderScope();
withRenderTarget(rLog, rScope, () => {
  qSend("r-a", "نوبت در حال اجرا");
  qSend("r-b", "پیامی که خیلی وقت پیش لغو شد");
  window.renderEvent({ type: "command_lifecycle", command_uuid: "r-b",
                       state: "cancelled", replayed: true });
});
check("a replayed cancellation drops the row without re-filling the composer",
  qRows().length === 0 && input.value === "",
  qRows().length + " rows / box «" + input.value + "»");

/* The same event unmarked is live, and it hands the text back — INTO a draft
   that already contains it. That is the second half of the old dedupe's cost:
   `input.value.includes(text)` swallowed a returned message whenever it
   happened to be a substring of what was being typed. */
input.value = "نوبت تازه و چیز دیگری";
withRenderTarget(rLog, rScope, () => {
  qSend("r-c", "نوبت تازه");
  window.renderEvent({ type: "command_lifecycle", command_uuid: "r-c",
                       state: "cancelled" });
});
check("a live cancellation returns its text even when the draft already contains it",
  qRows().length === 0 && input.value.split("نوبت تازه").length === 3,
  "box «" + input.value.replace(/\n/g, " \\n ") + "»");
input.value = "";

/* The recap may only be bought by a settle the CLI itself drove. idle_sync is a
   BACKSTOP — five seconds of silence, which a model can produce mid-turn — and
   a /recap fired on a wrong guess is not a wasted call but a lost answer: it
   reaches a server whose ledger was cleared by the same event, so the busy
   guard passes, `/recap` goes down the pipe of a CLI that is still working, and
   `_recap_wanted` swallows that turn's real reply. The observable is the
   decision rather than the request, because the request is gated on a token
   this harness deliberately does not have (see the case above). */
const recapReal = newRenderScope();
withRenderTarget(document.createElement("div"), recapReal, () => {
  window.renderEvent({ type: "wrapper", subtype: "user_echo",
                       text: "سلام", uuid: "cmd-recap-real" });
  window.renderEvent({ type: "result", subtype: "success", usage: {}, result: "ok" });
  doneCmd("cmd-recap-real");
});
const recapBackstop = newRenderScope();
withRenderTarget(document.createElement("div"), recapBackstop, () => {
  window.renderEvent({ type: "wrapper", subtype: "user_echo",
                       text: "سلام", uuid: "cmd-recap-stuck" });
  window.renderEvent({ type: "result", subtype: "success", usage: {}, result: "ok" });
  window.renderEvent({ type: "wrapper", subtype: "idle_sync" });
});
check("a turn the CLI closed itself may buy a recap; one idle_sync guessed at may not",
  recapReal.recapEligible === true && recapBackstop.recapEligible === false,
  "lifecycle settle → " + recapReal.recapEligible +
  " / idle_sync settle → " + recapBackstop.recapEligible);

const verdict = document.getElementById("verdict");
const failed = checks.filter(c => !c.ok);
verdict.innerHTML = "<b>" + (failed.length ? "<span class='fail'>FAIL</span>"
                                           : "<span class='pass'>PASS</span>") +
  " — " + (checks.length - failed.length) + "/" + checks.length + "</b>";
const ul = document.createElement("ul");
for (const c of checks) {
  const li = document.createElement("li");
  li.setAttribute("dir", "auto");
  li.className = c.ok ? "" : "fail";
  li.textContent = (c.ok ? "✓ " : "✗ ") + c.name + (c.detail ? "  [" + c.detail + "]" : "");
  ul.append(li);
}
verdict.append(ul);
window.__specChecks = checks;
</script>
</body>
</html>
