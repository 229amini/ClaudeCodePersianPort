<!doctype html>
<html dir="rtl" lang="fa">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>spec tests 1–12</title>
<link rel="stylesheet" href="/static/style.css">
<style>
  /* Harness chrome only — never let this file introduce direction rules. */
  body { grid-template-rows: 1fr auto auto; }
  .case-head {
    align-self: stretch; max-width: none;
    margin-block-start: 1.2em; padding: 6px 10px;
    border-inline-start: 3px solid var(--accent);
    background: var(--surface-2); border-radius: 6px;
  }
  .case-head b { font-weight: 700; }
  .case-head .expect { display: block; color: var(--fg-muted); font-size: .85em; }
  #verdict { padding: 10px var(--gap); background: var(--surface); border-block-start: 1px solid var(--border); }
  #verdict .fail { color: var(--danger); font-weight: 700; }
  #verdict .pass { color: var(--ok); font-weight: 700; }
</style>
</head>
<!-- data-render-only: this page carries a token so its subresources authenticate,
     but it must not open the SSE stream — live events would land in the middle
     of the test log. js/app.js reads the attribute. -->
<body data-render-only>

<main id="log" aria-label="spec tests"></main>

<!-- Test 6 needs the real composer handler, so the harness carries the real
     composer markup and lets js/composer.js bind to it. -->
<form id="composer">
  <label class="sr-only" for="input">ZWNJ test</label>
  <textarea id="input" rows="1" dir="auto"
            placeholder="تست ۶: «می» سپس Shift+Space سپس «رود»"></textarea>
  <button type="submit" id="send">ارسال</button>
</form>

<footer id="statusline"></footer>

<!-- js/composer.js reads this at module-evaluation time; without it the context
     notice silently no-ops, which is also what a broken one looks like. -->
<div id="context-notice" hidden></div>

<!-- Case 10 drives the REAL permission dialog through window.renderEvent, so the
     harness needs its markup verbatim from index.html. js/chrome.js reads these
     ids at module-evaluation time; without them showPermission() throws and the
     verdict comes back empty. -->
<dialog id="perm">
  <form method="dialog" id="perm-form">
    <h2 id="perm-title"></h2>
    <p id="perm-body" dir="auto"></p>
    <div id="perm-tool"></div>
    <pre id="perm-params"></pre>
    <div id="perm-ask"></div>
    <label id="perm-remember-row">
      <input type="checkbox" id="perm-remember">
      <span id="perm-remember-label"></span>
    </label>
    <menu>
      <button value="deny" class="ghost" id="perm-deny"></button>
      <button value="allow" id="perm-allow"></button>
    </menu>
  </form>
</dialog>

<div id="verdict"></div>

<!-- strings.fa.js and marked stay CLASSIC scripts (they set window globals and
     finish before any module runs); the app is a module tree. The harness block
     below MUST be type="module" too: module scripts are deferred and execute in
     document order, so this is what guarantees window.renderEvent exists by the
     time the cases run. As a classic script it would run FIRST and every
     assertion would fail in a way that looks exactly like a BiDi regression. -->
<script src="/static/strings.fa.js"></script>
<script src="/static/vendor/marked.min.js"></script>
<script type="module" src="/static/js/app.js"></script>
<script type="module">
/* Each case is pushed through the SHIPPING renderer (window.renderEvent), not a
   copy, so a regression in the renderer fails here. Cases match
   claude-persian-rtl-spec.md §"Test cases" exactly. */
const CASES = [
  [1, "سلام دنیا",
      "راست‌چین، راست به چپ، حروف چسبیده"],
  [2, "Hello world",
      "چپ‌چین، بدون تغییر"],
  [3, "فایل C:\\Users\\Lion\\Desktop\\test.md را باز کن",
      "متن فارسی راست‌چین؛ مسیر سالم و خوانا از چپ به راست، بک‌اسلش‌ها سر جای خود"],
  [4, "```js\nif (x > 0) { return \"ok\"; }\n```",
      "چپ‌چین، LTR، آکولاد و نقل‌قول سر جای خود"],
  [5, "نسخه 2.1.221 نصب شد",
      "شماره نسخه 2.1.221 خوانده شود، جابه‌جا نشود"],
  [6, null,
      "در کادر پایین بنویسید «می» + Shift+Space + «رود» → باید می‌رود شود، نه میرود"],
  [7, "این یک بند فارسی است که بلافاصله بعد از آن یک بلوک کد می‌آید.\n\n```py\ndef ok(): return 1\n```",
      "هیچ‌کدام جهت یا چینش دیگری را خراب نکند"],
  [8, "این یک بند طولانی فارسی است که باید روی چند خط بشکند و در هر خط راست‌چین بماند بدون آنکه دنباله حروف بریده شود. " +
      "متن باید با فاصله سطر مناسب نمایش داده شود تا حروف کشیده و زیرنویس‌دار روی هم نیفتند و خواندن آن راحت باشد. " +
      "این بند به‌عمد بلند نوشته شده تا شکست خط چندباره اتفاق بیفتد.",
      "چینش راست در همه خطوط، بدون بریدگی زیرنویس"],
];

// Kept from the classic-script era, when app.js and this block shared one
// global scope and both declaring `log` threw. Module scope makes that
// impossible now, but the assertions below are the contract — leave them alone.
const specLog = document.getElementById("log");

function caseHead(n, expected) {
  const head = document.createElement("div");
  head.className = "case-head";
  head.setAttribute("dir", "auto");
  head.innerHTML = "<b>تست " + n + "</b>";
  const exp = document.createElement("span");
  exp.className = "expect";
  exp.setAttribute("dir", "auto");
  exp.textContent = expected;
  head.append(exp);
  specLog.append(head);
}

for (const [n, markdown, expected] of CASES) {
  caseHead(n, expected);
  if (markdown === null) continue;   // case 6 is interactive
  window.renderEvent({
    type: "assistant",
    message: { content: [{ type: "text", text: markdown }] },
  });
}

/* Cases 9–12: BiDi at the moment of consent (spec rule 8). These are not
   messages — they are tool parameters and tool output, the one place the
   message-shaped cases above structurally cannot reach. */
const PERSIAN_LINE = "این خط فارسی است";
const WRITE_CONTENT = PERSIAN_LINE + "\nconst x = 1;\n\n" + "مقدار 42 تنظیم شد";

caseHead(9, "کارت ابزار: خطوط فارسیِ محتوای Write راست‌چین، کد لاتین چپ‌چین");
window.renderEvent({
  type: "assistant",
  message: { content: [{
    type: "tool_use", id: "spec9", name: "Write",
    input: { file_path: "C:\\Users\\Lion\\Desktop\\note.md", content: WRITE_CONTENT },
  }] },
});

caseHead(10, "پنجره تأیید: new_string فارسیِ Edit خواناست، نه چپ‌چین");
window.renderEvent({
  type: "wrapper", subtype: "permission_request", request_id: "spec10",
  tool_name: "Edit", tool_use_id: "spec10-tool",
  tool_input: {
    file_path: "C:\\Users\\Lion\\Desktop\\note.md",
    old_string: "old",
    new_string: PERSIAN_LINE + "\nreturn true;",
  },
});

caseHead(11, "خروجی ابزار با خطوط فارسی و لاتین: هر خط جهت خودش");
caseHead(12, "رقم لاتین کنار متن فارسی در همان خط می‌ماند");
window.renderEvent({
  type: "assistant",
  message: { content: [{
    type: "tool_use", id: "spec11", name: "Bash", input: { command: "type note.md" },
  }] },
});
window.renderEvent({
  type: "user",
  message: { content: [{
    type: "tool_result", tool_use_id: "spec11",
    content: PERSIAN_LINE + "\nSecond line in English\n" + "مقدار 42 تنظیم شد",
  }] },
});

/* Automated checks for the failures that are invisible to a screenshot. */
const checks = [];
function check(name, ok, detail) { checks.push({ name, ok, detail }); }

const bubbles = [...specLog.querySelectorAll(".msg.assistant")];

check("base CSS: .msg is unicode-bidi:plaintext",
  getComputedStyle(bubbles[0]).unicodeBidi === "plaintext",
  getComputedStyle(bubbles[0]).unicodeBidi);

const anyPre = specLog.querySelector("pre");
check("base CSS: pre is direction:ltr + isolate",
  getComputedStyle(anyPre).direction === "ltr" &&
  getComputedStyle(anyPre).unicodeBidi === "isolate",
  getComputedStyle(anyPre).direction + " / " + getComputedStyle(anyPre).unicodeBidi);

check("rule 1: block elements carry dir=auto",
  [...specLog.querySelectorAll(".msg p")].every(p => p.getAttribute("dir") === "auto"));

const case3 = bubbles[2];
const bdi = case3.querySelector("bdi.path");
check("rule 2: bare Windows path wrapped in <bdi>",
  !!bdi && bdi.textContent === "C:\\Users\\Lion\\Desktop\\test.md",
  bdi ? bdi.textContent : "no <bdi> found");

const case5 = bubbles[4];
const ver = case5.querySelector("bdi.path");
check("rule 2: version number isolated",
  !!ver && ver.textContent === "2.1.221", ver ? ver.textContent : "none");

check("rule 3: Vazirmatn is the body face",
  getComputedStyle(document.body).fontFamily.includes("Vazirmatn"));

check("rule 4: line-height >= 1.9 on Persian text",
  parseFloat(getComputedStyle(bubbles[0]).lineHeight) /
  parseFloat(getComputedStyle(bubbles[0]).fontSize) >= 1.89,
  getComputedStyle(bubbles[0]).lineHeight);

check("rule 5: digits inside <pre> stay Latin",
  !/[۰-۹]/.test(specLog.querySelector("pre").textContent));

check("no global dir=rtl leak: code block computes LTR inside RTL shell",
  getComputedStyle(specLog.querySelector("pre code")).direction === "ltr");

check("page does not scroll horizontally",
  document.documentElement.scrollWidth <= document.documentElement.clientWidth,
  document.documentElement.scrollWidth + " vs " + document.documentElement.clientWidth);

const input = document.getElementById("input");
input.value = "می" + "\u200C" + "رود";
check("rule 6: ZWNJ survives in the composer value",
  input.value.includes("\u200C"));

/* --- rule 8: LTR containers, per-line direction ---------------------------- */
const dirOf = (el) => el && getComputedStyle(el).direction;

/* A Write's content is rendered as a DIFF now, not as a parameter blob — so
   rule 8's contract ("LTR container, direction decided per line") has to hold
   in `.diff` instead of in `.tool-output`. Same rule, different element; these
   checks moved with it rather than being dropped, because the content under
   test is exactly the same Persian/Latin/blank mixture. */
const card9 = [...specLog.querySelectorAll("details.card.tool")]
  .find(c => c.querySelector(".diff"));
const box9 = card9?.querySelector(".diff");
const lines9 = box9 ? [...box9.querySelectorAll(".dt")] : [];

check("rule 8: tool-card diff box stays LTR",
  dirOf(box9) === "ltr", dirOf(box9) ?? "no diff box");

check("rule 8: Persian line inside the LTR box resolves RTL",
  lines9[0]?.getAttribute("dir") === "auto" && dirOf(lines9[0]) === "rtl",
  (lines9[0]?.textContent ?? "?") + " -> " + (dirOf(lines9[0]) ?? "none"));

check("rule 8: Latin line in the same box stays LTR",
  dirOf(lines9[1]) === "ltr", lines9[1]?.textContent ?? "none");

/* Direction alone was not enough: the container's `text-align: left` inherits
   into the lines, so an RTL line stayed pinned to the left edge. Anything but
   a left-forcing value means each line aligns to its own start. */
check("rule 8: the RTL line aligns to its own start, not the box's left",
  ["start", "right", "end"].includes(getComputedStyle(lines9[0] ?? document.body).textAlign),
  getComputedStyle(lines9[0] ?? document.body).textAlign);

check("rule 8: every line of the content survives, blank one included",
  lines9.length === 4 && lines9[2]?.textContent === "",
  lines9.length + " lines");

/* The diff itself: a Write is all additions, and the count on the collapsed row
   is what tells the user how big the change is before they open it. */
check("a Write renders as an all-additions diff",
  box9?.querySelectorAll(".dl.add").length === 4 &&
  box9?.querySelectorAll(".dl.del").length === 0,
  (box9?.querySelectorAll(".dl.add").length ?? 0) + " added, " +
  (box9?.querySelectorAll(".dl.del").length ?? 0) + " removed");
/* textContent is LOGICAL order and says "+4" no matter how it renders, so it
   cannot see this: + and − are BiDi-neutral, and in the RTL summary row they
   reorder to the far side of their digits — "+2 −1" reads "1- 2+" on screen.
   Only the computed direction catches it. Rule 2, smallest possible token. */
const stat9 = card9?.querySelector(".diff-stat");
check("the collapsed row's +/- count is LTR-isolated, not just Latin",
  stat9?.querySelector(".d-add")?.textContent === "+4" &&
  dirOf(stat9) === "ltr" && getComputedStyle(stat9).unicodeBidi === "isolate",
  (stat9?.textContent ?? "no count") + " -> " + (dirOf(stat9) ?? "none") +
  " / " + (stat9 ? getComputedStyle(stat9).unicodeBidi : "none"));

/* Not a BiDi rule, but the same class of silent failure: #log is a column flex
   box, and details.card sets overflow:hidden, which zeroes a flex item's
   automatic minimum size. Without flex:none every tool card was crushed to its
   border the moment the transcript got long enough to scroll. */
check("tool cards cannot be flex-shrunk out of existence",
  getComputedStyle(card9 ?? document.body).flexShrink === "0",
  getComputedStyle(card9 ?? document.body).flexShrink);

/* The tool row is the transcript's most repeated element, so its two silent
   failure modes are worth pinning: an unlisted tool must still say SOMETHING
   (falling through to the raw name, never to an empty row), and the target
   must be the file name — a full Windows path wraps and the row stops being
   one line, which is the whole point of the rail. */
const sum9 = card9?.querySelector("summary");
check("tool row names the action in Persian",
  sum9?.querySelector(".tool-verb")?.textContent === window.STRINGS.toolVerbs.Write,
  sum9?.querySelector(".tool-verb, .tool-name")?.textContent ?? "no label");

check("tool row shows the file name, not the whole path",
  sum9?.querySelector(".tool-target")?.textContent === "note.md",
  sum9?.querySelector(".tool-target")?.textContent ?? "no target");

check("tool row stays on one line",
  (sum9?.getBoundingClientRect().height ?? 99) < 40,
  Math.round(sum9?.getBoundingClientRect().height ?? 0) + "px");


/* The CLI narrates a stopped turn as a `user` message reading "[Request
   interrupted by user]". Rendered literally it reads as if the user typed an
   English sentence, right next to the Persian «متوقف شد» that already says it. */
const beforeInterrupt = specLog.querySelectorAll(".msg.user").length;
window.renderEvent({ type: "user", message: { content: [
  { type: "text", text: "[Request interrupted by user for tool use]" },
] } });
check("the CLI's English interrupt note never becomes a user bubble",
  specLog.querySelectorAll(".msg.user").length === beforeInterrupt,
  specLog.querySelectorAll(".msg.user").length + " vs " + beforeInterrupt);

/* Case 10 is the moment of consent, and it is now a real diff: the person
   approving an Edit sees the change, not two blobs to compare by eye. The BiDi
   contract is unchanged — the box is LTR, the Persian line inside it is not. */
const permBox = document.querySelector("#perm-params .diff");
const permLine = permBox?.querySelector(".dl.add .dt");
check("case 10: the permission dialog shows an Edit as a diff, per-line direction",
  dirOf(permBox) === "ltr" && dirOf(permLine) === "rtl" &&
  permBox.querySelectorAll(".dl.del").length === 1,
  (permLine?.textContent ?? "no dialog diff") + " -> " + (dirOf(permLine) ?? "none"));

// Dismiss before the DOM dump so the modal backdrop does not sit over #verdict.
window.renderEvent({ type: "wrapper", subtype: "permission_resolved",
                     request_id: "spec10", tool_use_id: "spec10-tool",
                     decision: "deny" });

const out11 = [...specLog.querySelectorAll("details.card.tool")]
  .at(-1)?.querySelector(".card-body > .tool-output");
const lines11 = out11 ? [...out11.children] : [];
check("case 11: tool_result mixes directions line by line",
  dirOf(out11) === "ltr" && dirOf(lines11[0]) === "rtl" && dirOf(lines11[1]) === "ltr",
  lines11.map(dirOf).join(",") || "no tool_result output");

// Rule 8 is per LINE, not per run: a run-level <bdi> would strand these digits
// in their own isolate and reorder them against the Persian around them.
const digitLine = lines11[2];
check("case 12: Latin digits stay inside their Persian line",
  digitLine?.textContent === "\u0645\u0642\u062F\u0627\u0631 42 \u062A\u0646\u0638\u06CC\u0645 \u0634\u062F" &&
  digitLine.children.length === 0 && dirOf(digitLine) === "rtl",
  (digitLine?.textContent ?? "none") + " -> " + (dirOf(digitLine) ?? "none"));

/* An MCP tool has no Persian verb and never will — its name arrives as
   mcp__<server>__<tool>, long enough to fill the rail on its own. The row must
   split it, and the width guard is the point: a textContent check passes just
   as happily on a label that renders clipped.
   Rendered AFTER the checks above, because two of them read `.at(-1)` of the
   tool cards and a new card at the end silently steals their subject. */
window.renderEvent({
  type: "assistant",
  message: { content: [{
    type: "tool_use", id: "spec-mcp", name: "mcp__claude-in-chrome__tabs_context_mcp",
    input: {},
  }] },
});
const sumMcp = [...specLog.querySelectorAll("details.card.tool summary")].at(-1);
check("MCP tool row names the tool and its server separately",
  sumMcp?.querySelector(".tool-name")?.textContent === "tabs_context_mcp" &&
  sumMcp?.querySelector(".tool-server")?.textContent === "claude-in-chrome",
  (sumMcp?.querySelector(".tool-name")?.textContent ?? "no name") + " @ " +
  (sumMcp?.querySelector(".tool-server")?.textContent ?? "no server"));

check("MCP tool row fits on one line, unclipped",
  (sumMcp?.getBoundingClientRect().height ?? 99) < 40 &&
  sumMcp?.scrollWidth <= sumMcp?.clientWidth + 1,
  Math.round(sumMcp?.getBoundingClientRect().height ?? 0) + "px, " +
  sumMcp?.scrollWidth + " vs " + sumMcp?.clientWidth);

/* AskUserQuestion. It arrives over the permission pipe but is a QUESTION, and
   the two failure modes are invisible to a screenshot of a passing run: the
   dialog offering "don't ask again" for a question, and the option labels not
   reaching the inputs' value — that value is the wire format the CLI matches
   against, so a cosmetic-looking change there silently sends the wrong answer. */
const ASK_QUESTIONS = [{
  header: "نوشیدنی",
  question: "چای یا قهوه؟ " + PERSIAN_LINE,
  multiSelect: true,
  options: [{ label: "Tea", description: "چای داغ" }, { label: "قهوه", description: "" }],
}];
window.renderEvent({
  type: "assistant",
  message: { content: [{
    type: "tool_use", id: "spec13", name: "AskUserQuestion",
    input: { questions: ASK_QUESTIONS },
  }] },
});
window.renderEvent({
  type: "wrapper", subtype: "permission_request", request_id: "spec13",
  tool_name: "AskUserQuestion", tool_use_id: "spec13",
  tool_input: { questions: ASK_QUESTIONS },
});

const permDialog = document.getElementById("perm");
check("ask: a question is not an approval — no 'remember this tool' offered",
  permDialog.classList.contains("asking") &&
  getComputedStyle(document.getElementById("perm-remember-row")).display === "none",
  permDialog.className + " / " +
  getComputedStyle(document.getElementById("perm-remember-row")).display);

const askOpts = [...document.querySelectorAll("#perm-ask .ask-opt input")];
check("ask: multiSelect renders checkboxes carrying the option label as value",
  askOpts.length === 2 && askOpts.every(i => i.type === "checkbox") &&
  askOpts.map(i => i.value).join("|") === "Tea|قهوه",
  askOpts.map(i => i.type + ":" + i.value).join(", ") || "no options");

const askText = document.querySelector("#perm-ask .ask-text");
check("ask: a Persian question resolves RTL inside the dialog",
  dirOf(askText) === "rtl" && !!document.querySelector("#perm-ask .ask-free"),
  (dirOf(askText) ?? "none") + " / free-text " +
  (document.querySelector("#perm-ask .ask-free") ? "present" : "MISSING"));

// The transcript half — the only rendering that exists in history replay.
const askCard = specLog.querySelector("details.card.ask .q-options");
check("ask: the transcript shows the options, not raw JSON",
  [...(askCard?.children ?? [])].length === 2 &&
  askCard.textContent.includes("Tea") && !askCard.textContent.includes("{"),
  askCard?.textContent.trim() ?? "no question card");

/* Rule 2 where it actually bites: a Latin option label sitting above a Persian
   description. Without the <bdi> the label wins dir="auto" for the whole row and
   drags the Persian text left — which is the exact defect this list would show
   for any English-labelled choice (model names, file names, commands). */
const latinOpt = askCard?.children[0];
check("ask: a Latin option label does not flip its Persian description",
  dirOf(latinOpt) === "rtl" && latinOpt?.querySelector("bdi.q-label")?.textContent === "Tea",
  (dirOf(latinOpt) ?? "none") + " / " +
  (latinOpt?.querySelector("bdi.q-label") ? "isolated" : "NOT isolated"));

window.renderEvent({ type: "wrapper", subtype: "permission_resolved",
                     request_id: "spec13", tool_use_id: "spec13",
                     decision: "allow" });

/* The context notice. Driven by the number the CLI measures, so the check is
   "does a usage event above the threshold produce the two actions" — and that
   the percentage is written in Persian digits, since it is prose (rule 5). */
const ctx = document.getElementById("context-notice");
window.renderEvent({ type: "wrapper", subtype: "usage", context: 40 });
check("context notice stays away while there is room", ctx.hidden);

window.renderEvent({ type: "wrapper", subtype: "usage", context: 91 });
const ctxBtns = [...ctx.querySelectorAll(".ctx-btn .ctx-btn-text")].map(b => b.textContent);
check("context notice offers compact AND clear, plus a way out",
  !ctx.hidden && ctxBtns.length === 3 &&
  ctxBtns[0] === window.STRINGS.ctxCompact && ctxBtns[1] === window.STRINGS.ctxClear,
  ctxBtns.join(" | ") || "no actions");
check("context percentage is written in Persian digits (rule 5)",
  ctx.querySelector(".ctx-body")?.textContent === "۹۱٪ از حافظه گفتگو استفاده شده است.",
  ctx.querySelector(".ctx-body")?.textContent ?? "no body");

// A compact or a clear drops the number; the notice must let go by itself.
window.renderEvent({ type: "wrapper", subtype: "usage", context: 12 });
check("context notice clears itself once the conversation shrinks", ctx.hidden);

// The hard limit arrives as a failed turn with no percentage at all.
window.renderEvent({
  type: "result", subtype: "error_during_execution", is_error: true,
  result: "Context exceeds the 200000-token limit by 5000 tokens — run /compact or /clear to continue.",
});
check("the CLI's own English limit message raises the Persian notice",
  !ctx.hidden && ctx.classList.contains("urgent") &&
  ctx.querySelectorAll(".ctx-btn").length === 2,
  ctx.hidden ? "hidden" : ctx.className + " / " + ctx.querySelectorAll(".ctx-btn").length + " actions");
ctx.hidden = true;

const verdict = document.getElementById("verdict");
const failed = checks.filter(c => !c.ok);
verdict.innerHTML = "<b>" + (failed.length ? "<span class='fail'>FAIL</span>"
                                           : "<span class='pass'>PASS</span>") +
  " — " + (checks.length - failed.length) + "/" + checks.length + "</b>";
const ul = document.createElement("ul");
for (const c of checks) {
  const li = document.createElement("li");
  li.setAttribute("dir", "auto");
  li.className = c.ok ? "" : "fail";
  li.textContent = (c.ok ? "✓ " : "✗ ") + c.name + (c.detail ? "  [" + c.detail + "]" : "");
  ul.append(li);
}
verdict.append(ul);
window.__specChecks = checks;
</script>
</body>
</html>
